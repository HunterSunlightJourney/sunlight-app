// iOS-style notification that slides in from top

function Toast({toast,onDismiss}){
  useEffect(()=>{
    if(!toast) return;
    const t=setTimeout(onDismiss, 3800);
    return()=>clearTimeout(t);
  },[toast]);
  if(!toast) return null;
  return(
    <div onClick={onDismiss} style={{
      position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:999,
      width:"calc(100% - 32px)",maxWidth:358,
      background:"rgba(30,30,40,0.92)",
      backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",
      borderRadius:18,padding:"14px 16px",
      display:"flex",alignItems:"center",gap:14,
      boxShadow:"0 8px 32px rgba(0,0,0,0.32),0 0 0 0.5px rgba(255,255,255,0.08)",
      animation:"slideDown 0.4s cubic-bezier(0.34,1.56,0.64,1)",cursor:"pointer"
    }}>
      <div style={{fontSize:32,flexShrink:0,animation:"springPop 0.5s 0.2s both"}}>{toast.icon}</div>
      <div>
        <div style={{fontWeight:700,fontSize:14,color:"#fff",marginBottom:2}}>{toast.title}</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.6)",lineHeight:1.4}}>{toast.body}</div>
      </div>
    </div>
  );
}

          )}

        ))}

      <button onClick={()=>isLast?onDone(why):setSlide(s=>s+1)} disabled={!canAdvance} style={{
        width:"100%",maxWidth:320,padding:18,borderRadius:18,

        color:"rgba(255,255,255,0.85)",
        border:(isLast&&canAdvance)?"none":"1px solid rgba(255,255,255,0.15)",
        fontSize:17,fontWeight:700,letterSpacing:"-0.01em",
        transition:"all 0.2s"
      }}>{isLast?"Let's go →":"Continue"}</button>
    </div>
  );
}

// ─── Patterns Modal ───────────────────────────────────────────────────────────

function PatternsModal({logs,onClose}){
  const overcome = logs.filter(l=>l.outcome==="overcome").length;
  const gaveIn   = logs.filter(l=>l.outcome==="gave-in").length;
  const total    = logs.length||1;

  // Platform counts
  const platCount={};
  logs.forEach(l=>{if(l.platform) platCount[l.platform]=(platCount[l.platform]||0)+1;});
  const topPlats=Object.entries(platCount).sort((a,b)=>b[1]-a[1]);
  const maxP=topPlats[0]?.[1]||1;

  // Platform recommendations: any platform 3+ times in last 10 logs
  const recent=logs.slice(-10);
  const recPlat={};
  recent.forEach(l=>{if(l.platform) recPlat[l.platform]=(recPlat[l.platform]||0)+1;});
  const recs=Object.entries(recPlat).filter(([,c])=>c>=3).sort((a,b)=>b[1]-a[1]);

  // Location counts
  const locCount={};
  logs.forEach(l=>{if(l.location) locCount[l.location]=(locCount[l.location]||0)+1;});
  const topLocs=Object.entries(locCount).sort((a,b)=>b[1]-a[1]).slice(0,4);

  // Time-of-day buckets
  const timeBuckets={"Morning (6-12)":0,"Afternoon (12-6)":0,"Evening (6-10)":0,"Late night (10+)":0};
  logs.forEach(l=>{
    if(!l.logTime) return;
    const h=parseInt(l.logTime);
    const pm=l.logTime.includes("PM");
    const hr=pm&&h!==12?h+12:(!pm&&h===12?0:h);
    if(hr>=6&&hr<12)  timeBuckets["Morning (6-12)"]++;
    else if(hr>=12&&hr<18) timeBuckets["Afternoon (12-6)"]++;
    else if(hr>=18&&hr<22) timeBuckets["Evening (6-10)"]++;
    else timeBuckets["Late night (10+)"]++;
  });
  const maxT=Math.max(...Object.values(timeBuckets),1);

  // Thought vs saw
  const thoughtCount=logs.filter(l=>l.triggerType==="thought").length;
  const sawCount    =logs.filter(l=>l.triggerType==="saw").length;

  const Bar=({val,max,color="#c8913c"})=>(
    <div style={{height:7,borderRadius:999,background:"#1a1714",overflow:"hidden",flex:1}}>
      <div style={{height:"100%",borderRadius:999,background:color,width:`${Math.max(val/max*100,3)}%`,transition:"width 0.9s cubic-bezier(0.34,1.2,0.64,1)"}}/>
    </div>
  );

  return(
    <Sheet onClose={onClose} maxH="90vh">
      <div style={{padding:"18px 22px 0",flexShrink:0}}>
        <div style={{fontWeight:800,fontSize:20,color:"#ede4d0",marginBottom:3,letterSpacing:"-0.02em"}}>My Patterns</div>
        <div style={{fontSize:13,color:"#8a8078",marginBottom:14}}>Based on {logs.length} urge log{logs.length!==1?"s":""}</div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0 22px 40px",display:"flex",flexDirection:"column",gap:20}}>

        {/* Overcome vs Gave In */}
        <div className="card" style={{padding:18}}>
          <div style={{fontSize:12,fontWeight:700,color:"#7a7068",marginBottom:12,letterSpacing:"0.06em"}}>WIN RATE</div>
          <div style={{display:"flex",gap:4,height:10,borderRadius:999,overflow:"hidden",marginBottom:10}}>
            <div style={{flex:overcome,background:"#c8913c",borderRadius:999,transition:"flex 0.8s cubic-bezier(0.34,1.2,0.64,1)"}}/>
            <div style={{flex:Math.max(gaveIn,0.01),background:"rgba(255,210,140,0.1)",borderRadius:999}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#8a8078"}}>
            <span style={{fontWeight:700,color:"#c8913c"}}>💪 {overcome} overcome ({Math.round(overcome/total*100)}%)</span>
            <span>😔 {gaveIn} gave in</span>
          </div>
        </div>

        {/* Platform recommendations */}
        {recs.length>0&&(
          <div style={{background:"rgba(200,145,60,0.1)",border:"1.5px solid rgba(200,145,60,0.3)",borderRadius:18,padding:18}}>
            <div style={{fontSize:12,fontWeight:800,color:"#c4a882",marginBottom:8,letterSpacing:"0.06em"}}>💡 PATTERN SPOTTED</div>
            {recs.map(([p,c])=>(
              <div key={p} style={{marginBottom:recs.length>1?10:0}}>
                <div style={{fontSize:15,fontWeight:700,color:"#c4a882",marginBottom:4,letterSpacing:"-0.01em"}}>{p} triggered {c} of your last {recent.length} urges.</div>
                <div style={{fontSize:13,color:"#a16207",lineHeight:1.6}}>Consider a short break — not forever, just 3–5 days. See how you feel without it. You might be surprised.</div>
              </div>
            ))}
          </div>
        )}

        {/* Time of day */}
        <div className="card" style={{padding:18}}>
          <div style={{fontSize:12,fontWeight:700,color:"#7a7068",marginBottom:14,letterSpacing:"0.06em"}}>WHEN DO URGES HIT?</div>
          {Object.entries(timeBuckets).map(([label,count])=>(
            <div key={label} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <div style={{fontSize:12,color:"#c0b8a8",fontWeight:500,minWidth:120}}>{label}</div>
              <Bar val={count} max={maxT}/>
              <div style={{fontSize:12,color:"#7a7068",minWidth:20,textAlign:"right"}}>{count}</div>
            </div>
          ))}
        </div>

        {/* What triggered it */}
        <div className="card" style={{padding:18}}>
          <div style={{fontSize:12,fontWeight:700,color:"#7a7068",marginBottom:14,letterSpacing:"0.06em"}}>TRIGGER TYPE</div>
          <div style={{display:"flex",gap:10}}>
            <div style={{flex:1,background:"#1a1714",borderRadius:14,padding:"14px 12px",textAlign:"center"}}>
              <div style={{fontSize:24,marginBottom:5}}>💭</div>
              <div style={{fontWeight:800,fontSize:20,color:"#ede4d0"}}>{thoughtCount}</div>
              <div style={{fontSize:11,color:"#7a7068",fontWeight:600,marginTop:2}}>A thought</div>
            </div>
            <div style={{flex:1,background:"#1a1714",borderRadius:14,padding:"14px 12px",textAlign:"center"}}>
              <div style={{fontSize:24,marginBottom:5}}>👁</div>
              <div style={{fontWeight:800,fontSize:20,color:"#ede4d0"}}>{sawCount}</div>
              <div style={{fontSize:11,color:"#7a7068",fontWeight:600,marginTop:2}}>Something I saw</div>
            </div>
          </div>
        </div>

        {/* Platform breakdown */}
        {topPlats.length>0&&(
          <div className="card" style={{padding:18}}>
            <div style={{fontSize:12,fontWeight:700,color:"#7a7068",marginBottom:14,letterSpacing:"0.06em"}}>WHERE YOU SAW IT</div>
            {topPlats.map(([p,c])=>(
              <div key={p} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div style={{fontSize:13,color:"#c0b8a8",fontWeight:600,minWidth:110}}>{p}</div>
                <Bar val={c} max={maxP} color={recs.find(r=>r[0]===p)?"#c8541a":"#c8913c"}/>
                <div style={{fontSize:12,color:"#7a7068",minWidth:20,textAlign:"right"}}>{c}</div>
              </div>
            ))}
          </div>
        )}

        {/* Location */}
        {topLocs.length>0&&(
          <div className="card" style={{padding:18}}>
            <div style={{fontSize:12,fontWeight:700,color:"#7a7068",marginBottom:14,letterSpacing:"0.06em"}}>WHERE ARE YOU WHEN IT HITS?</div>
            {topLocs.map(([loc,c])=>(
              <div key={loc} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div style={{fontSize:13,color:"#c0b8a8",fontWeight:500,minWidth:130}}>{loc}</div>
                <Bar val={c} max={topLocs[0][1]}/>
                <div style={{fontSize:12,color:"#7a7068",minWidth:20,textAlign:"right"}}>{c}</div>
              </div>
            ))}
          </div>
        )}

        {logs.length<3&&(
          <div style={{background:"#252118",border:"1.5px dashed rgba(255,210,140,0.15)",borderRadius:14,padding:18,textAlign:"center"}}>
            <div style={{fontSize:13,color:"#7a7068",lineHeight:1.6}}>Log {3-logs.length} more urge{3-logs.length!==1?"s":""} to unlock your patterns.</div>
          </div>
        )}
      </div>
    </Sheet>
  );
}

// ─── Login ────────────────────────────────────────────────────────────────────

const inpStyle={width:"100%",padding:"15px 18px",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:14,fontSize:16,outline:"none",marginBottom:12,color:"#ede4d0",background:"#1e1b17",boxSizing:"border-box",fontFamily:"inherit"};

function LoginScreen({onLogin,onSignup}){
  const [email,   setEmail]   =useState("");
  const [pass,    setPass]    =useState("");
  const [err,     setErr]     =useState("");
  const [loading, setLoading] =useState(false);

  const submit=async()=>{
    if(!email.trim()){setErr("Enter your email.");return;}
    if(!pass){setErr("Enter your password.");return;}
    setLoading(true);
    setErr("");
    const error=await onLogin(email.trim().toLowerCase(),pass);
    if(error){
      setErr(error==="Invalid login credentials"?"Wrong email or password.":error);
      setLoading(false);
    }
    // On success, login() sets screen to "app" directly
  };

  const handleKey=e=>{if(e.key==="Enter") submit();};

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:"#1e1b17",padding:"56px 28px 40px"}}>
      <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center"}}>
        <div style={{textAlign:"center",marginBottom:48}}>
          <div style={{fontSize:64,marginBottom:14,filter:"drop-shadow(0 4px 16px rgba(255,180,0,0.3))"}}>☀️</div>
          <div style={{fontWeight:800,fontSize:34,color:"#ede4d0",letterSpacing:"-0.03em",marginBottom:8}}>Sunlight</div>
          <div style={{fontSize:16,color:"#7a7068",fontWeight:400}}>Sign in to continue</div>
        </div>
        <input type="email" placeholder="Email address" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={handleKey} style={inpStyle} autoComplete="email"/>
        <input type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={handleKey} style={{...inpStyle,letterSpacing:"0.05em"}} autoComplete="current-password"/>
        {err&&<div style={{fontSize:13,color:"#c07060",marginBottom:10,fontWeight:500}}>{err}</div>}
        <button onClick={submit} disabled={loading}
          style={{width:"100%",padding:17,borderRadius:16,background:loading?"#8a4018":"#c8541a",color:"#fff",fontSize:17,fontWeight:800,border:"none",marginBottom:12,letterSpacing:"-0.01em",opacity:loading?0.8:1}}>
          {loading?"Signing in…":"Sign In"}
        </button>
        <button onClick={onSignup} style={{width:"100%",padding:15,borderRadius:16,background:"#1a1714",color:"#c0b8a8",fontSize:16,fontWeight:600,border:"none"}}>Create Account</button>
      </div>
    </div>
  );
}

// ─── Signup ───────────────────────────────────────────────────────────────────

function SignupScreen({onSignup,onBack}){
  const [f,  setF]=useState({name:"",email:"",phone:"",password:"",bio:"",photo:null,color:"#3b82f6"});
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const fileRef=useRef();
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const handlePhoto=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>set("photo",ev.target.result);r.readAsDataURL(file);};
  const submit=async()=>{
    if(!f.name.trim()){setErr("Name is required.");return;}
    if(!f.email.trim()){setErr("Email is required.");return;}
    if(!f.phone.trim()){setErr("Phone is required.");return;}
    if(!f.password||f.password.length<6){setErr("Password must be at least 6 characters.");return;}
    setLoading(true);
    setErr("");
    const error=await onSignup(f);
    if(error){setErr(error);setLoading(false);}
  };
  const fld=(ph,k,t="text")=><input type={t} placeholder={ph} value={f[k]} onChange={e=>set(k,e.target.value)} style={{width:"100%",padding:"13px 16px",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:13,fontSize:15,outline:"none",marginBottom:10,color:"#ede4d0",background:"#1e1b17"}}/>;
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:"#1e1b17"}}>
      <div style={{padding:"18px 22px",borderBottom:"1px solid rgba(255,210,140,0.07)",display:"flex",alignItems:"center",gap:14}}>
        <button onClick={onBack} style={{background:"none",border:"none",fontSize:24,color:"#c0b8a8",lineHeight:1,padding:0}}>←</button>
        <div style={{fontWeight:800,fontSize:18,color:"#ede4d0",letterSpacing:"-0.02em"}}>Create Account</div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"22px 22px 40px"}}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:28}}>
          <div onClick={()=>fileRef.current.click()} style={{position:"relative",cursor:"pointer"}}>
            <div style={{width:90,height:90,borderRadius:"50%",background:f.color,overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:34,boxShadow:"0 4px 20px rgba(0,0,0,0.15)"}}>
              {f.photo?<img src={f.photo} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:(f.name?ini(f.name):"?")}
            </div>
            <div style={{position:"absolute",bottom:0,right:0,width:28,height:28,borderRadius:"50%",background:"#1e1b17",color:"#fff",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",border:"2.5px solid #141210",boxShadow:"0 2px 8px rgba(0,0,0,0.3)"}}>+</div>
          </div>
          <input ref={fileRef} type="file" accept="image/*" onChange={handlePhoto} style={{display:"none"}}/>
          <div style={{fontSize:12,color:"#7a7068",marginTop:10,marginBottom:12,fontWeight:500}}>Tap to upload photo</div>
          <div style={{display:"flex",gap:8}}>{COLORS.map(c=><button key={c} onClick={()=>set("color",c)} style={{width:28,height:28,borderRadius:"50%",background:c,border:f.color===c?"3px solid #c8913c":"2.5px solid transparent",boxShadow:f.color===c?"0 0 0 2px rgba(200,145,60,0.4) inset":""}}/>)}</div>
        </div>
        {fld("Full name *","name")}
        {fld("Email address *","email","email")}
        {fld("Phone number *","phone","tel")}
        {fld("Password *","password","password")}
        <textarea placeholder="Short bio (optional)" value={f.bio} onChange={e=>set("bio",e.target.value)} rows={2}
          style={{width:"100%",padding:"13px 16px",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:13,fontSize:15,outline:"none",resize:"none",marginBottom:10,color:"#ede4d0",background:"#1e1b17",fontFamily:"inherit"}}/>
        {err&&<div style={{fontSize:13,color:"#c07060",marginBottom:10,fontWeight:500}}>{err}</div>}
        <button onClick={submit} disabled={loading} style={{width:"100%",padding:16,borderRadius:16,background:loading?"#8a4018":"#c8541a",color:"#fff",fontSize:16,fontWeight:800,border:"none",letterSpacing:"-0.01em",opacity:loading?0.8:1}}>{loading?"Creating account…":"Create Account"}</button>
      </div>
    </div>
  );
}

// ─── Completion Ring Badge ─────────────────────────────────────────────────────

function CompletionRingBadge({done,total}){
  const size=54,r=21,cx=27,cy=27;
  const circ=2*Math.PI*r;
  const pct=total>0?Math.min(done/total,1):0;
  const dash=circ*pct;
  return(
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={cx} cy={cy} r={r} fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.1)" strokeWidth={3.5}/>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#c8913c" strokeWidth={3.5}
          strokeDasharray={`${dash} ${circ-dash}`} strokeLinecap="round"
          style={{transition:"stroke-dasharray 0.8s cubic-bezier(0.34,1.2,0.64,1)"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
        fontSize:11,fontWeight:800,color:"#ede4d0",letterSpacing:"-0.01em",lineHeight:1,flexDirection:"column",gap:0}}>
        <span style={{fontSize:13,fontWeight:900}}>{done}</span>
        <span style={{fontSize:8.5,color:"rgba(255,255,255,0.45)",fontWeight:700}}>/{total}</span>
      </div>
    </div>
  );
}

// ─── Dashboard ────────────────────────────────────────────────────────────────

function Dashboard({me,logs,library,users,urges,groupMsgs,onTabChange,onProfile,callLink,startHereVideo,myWhy,setMyWhy,checkIns,onCheckIn,levelChecks,setLevelChecks,onCheckChange,onboardingDone,hunterUnread=0,onGoToChannel,onLogSlip}){

  // ── Smart tips engine → returns array of short punchy insights ──
  const tips=[];
  const recent=logs.slice(-10);

  const platCount={};
  recent.forEach(l=>{if(l.platform) platCount[l.platform]=(platCount[l.platform]||0)+1;});
  const topPlat=Object.entries(platCount).sort((a,b)=>b[1]-a[1])[0];
  if(topPlat&&topPlat[1]>=2) tips.push({icon:"📱",short:`${topPlat[0]} triggered ${topPlat[1]} of your last urges.`,body:`Delete it for 7 days — not forever. See how you feel.`});

  const lateNight=recent.filter(l=>{
    if(!l.logTime) return false;
    const h=parseInt(l.logTime),pm=l.logTime.includes("PM");
    const hr=pm&&h!==12?h+12:(!pm&&h===12?0:h);
    return hr>=22||hr<5;
  });
  if(lateNight.length>=2) tips.push({icon:"🌙",short:`${lateNight.length} urges hit after 10 PM.`,body:`Plug your phone in outside the bedroom tonight. Protect that space.`});

  const bedroomLogs=recent.filter(l=>l.location?.includes("Bedroom"));
  if(bedroomLogs.length>=2&&lateNight.length<2) tips.push({icon:"🛏",short:`${bedroomLogs.length} urges happened in your bedroom.`,body:`Charge your phone in the hallway. A $10 alarm clock is enough.`});

  const carLogs=recent.filter(l=>l.location?.includes("car"));
  if(carLogs.length>=2) tips.push({icon:"🚗",short:`Urges keep hitting in the car.`,body:`Start an audiobook or podcast you only play while driving.`});

  const thoughtLogs=recent.filter(l=>l.triggerType==="thought");
  if(thoughtLogs.length>=3&&(!topPlat||thoughtLogs.length>topPlat[1])) tips.push({icon:"💭",short:`Most urges come from thoughts, not content.`,body:`60-second cold shower when a thought hits resets your nervous system.`});

  const partner=users.find(u=>u.id===me.partnerId);
  if(!partner) tips.push({icon:"🤝",short:`No accountability partner yet.`,body:`Men with partners overcome significantly more urges. Ask Coach Hunter.`});

  const recentGaveIn=logs.slice(-4).filter(l=>l.outcome==="gave-in");
  if(recentGaveIn.length>=2&&partner) tips.push({icon:"💬",short:`Rough patch — ${recentGaveIn.length} give-ins recently.`,body:`One message to ${partner.name} can shift the whole thing.`});

  const recentWins=logs.slice(-5).filter(l=>l.outcome==="overcome");
  if(recentWins.length>=4&&recentGaveIn.length===0) tips.push({icon:"🔥",short:`${recentWins.length} overcomes in a row.`,body:`You know how this fight ends. Keep going.`});

  // Data-driven insight line
  const getDataInsight=()=>{
    const gaveInByDay={};
    logs.forEach(l=>{if(l.outcome==="gave-in") gaveInByDay[new Date(l.ts).getDay()]=(gaveInByDay[new Date(l.ts).getDay()]||0)+1;});
    const dnames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const cleanDays=dnames.filter((_,i)=>!gaveInByDay[i]&&logs.some(l=>new Date(l.ts).getDay()===i));
    if(cleanDays.length>0) return{icon:"📅",short:`You've never given in on a ${cleanDays[0]}.`,body:`That's a real pattern — protect that day.`};
    const locW={};logs.filter(l=>l.outcome==="overcome").forEach(l=>{if(l.location)locW[l.location]=(locW[l.location]||0)+1;});
    const topL=Object.entries(locW).sort((a,b)=>b[1]-a[1])[0];
    if(topL) return{icon:"📍",short:`You fight best at ${topL[0].replace(/^[^\s]+\s/,"").toLowerCase()}.`,body:`${topL[1]} of your wins happened there.`};
    if(urges>=5) return{icon:"💪",short:`${urges} urges overcome.`,body:`Each one is a vote for the man you're becoming.`};
    return{icon:"🌅",short:`Log urges to unlock personal insights.`,body:`Every press of the Red Button teaches us your patterns.`};
  };

  if(tips.length===0) tips.push({icon:"🌅",short:`Log your first urge to unlock insights.`,body:`Every time you press the Red Button, we learn your patterns.`});

  // Prepend data insight at front
  const dataInsight=getDataInsight();
  const allTips=[dataInsight,...tips];

  // ── Progress data ──
  const nm=nextMilestone(urges);
  const prevMS=nm?MILESTONES[MILESTONES.indexOf(nm.next)-1]||0:null;
  const progressPct=nm?Math.round((urges-prevMS)/(nm.next-prevMS)*100):100;
  const nextBadge=nm?BADGE_DEFS.find(b=>b.id===["first","five","ten","tfive","fifty"][MILESTONES.indexOf(nm.next)]):null;

  // ── Badges & challenges ──
  const earnedBadges=me.badges.map(id=>BADGE_DEFS.find(b=>b.id===id)).filter(Boolean);
  const activeChallenges=library.filter(l=>l.type==="challenge"&&!l.completions.includes(me.id));

  // Latest group chat message
  const latestMsg=groupMsgs.filter(m=>!m.isAnn).at(-1);
  const latestMsgUser=latestMsg?users.find(u=>u.id===latestMsg.userId):null;

  // ── Insights expand state ──
  const [insightsOpen,setInsightsOpen]=React.useState(false);

  // ── Level logic ──
  const effectiveChecks={...levelChecks};
  const toggleCheck=(id)=>{
    const newVal=!levelChecks[id];
    setLevelChecks(p=>({...p,[id]:newVal}));
    if(onCheckChange) onCheckChange(id,newVal);
  };
  const l1Items=LEVELS[0].items;
  const l1Done=l1Items.filter(it=>effectiveChecks[it.id]).length;
  const l1Complete=l1Done===l1Items.length;
  const ouDone=OU_VIDEOS.filter(v=>effectiveChecks[v.id]).length;
  const l2Items=LEVELS[1].items;
  const l2Done=l2Items.filter(it=>effectiveChecks[it.checkId]).length;
  const l2Complete=l2Done===l2Items.length;

  // ── Sub-page navigation (level detail / method deep-dive / journal) ──
  const [subPage,setSubPage]=React.useState(null); // null | {type:"level",id} | {type:"method",id} | {type:"journal"}

  // ── Journal page render ──
  if(subPage?.type==="journal"){
    const sorted=[...logs].sort((a,b)=>b.ts-a.ts);
    const fmtDate=ts=>{
      const d=new Date(ts);
      return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
    };
    return(
      <div style={{height:"100%",display:"flex",flexDirection:"column",background:"#141210"}}>
        {/* Back header */}
        <div className="frosted-dark" style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:14,flexShrink:0,borderBottom:"0.5px solid rgba(255,210,140,0.07)"}}>
          <button onClick={()=>setSubPage(null)} style={{background:"none",border:"none",fontSize:24,color:"#c0b8a8",padding:0,lineHeight:1}}>←</button>
          <div>
            <div style={{fontWeight:800,fontSize:18,color:"#ede4d0",letterSpacing:"-0.02em"}}>Urge Journal</div>
            <div style={{fontSize:12,color:"#7a7068",marginTop:1}}>{logs.length} entry{logs.length!==1?"s":""} logged</div>
          </div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"16px 16px 48px",display:"flex",flexDirection:"column",gap:12}}>
          {sorted.length===0&&(
            <div style={{textAlign:"center",padding:"60px 20px"}}>
              <div style={{fontSize:40,marginBottom:14}}>📓</div>
              <div style={{fontWeight:700,fontSize:17,color:"#ede4d0",marginBottom:6}}>No urges logged yet</div>
              <div style={{fontSize:14,color:"#7a7068",lineHeight:1.6}}>When you hit the urge button, your entries will appear here.</div>
            </div>
          )}
          {sorted.map((log,i)=>{
            const overcame=log.outcome==="overcome";
            return(
              <div key={log.id} className="card" style={{padding:"16px 16px",animation:`slideUp 0.25s ${i*0.04}s both`}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{fontSize:18}}>{overcame?"💪":"😔"}</div>
                    <div style={{fontWeight:700,fontSize:15,color:overcame?"#c8913c":"#c07060",letterSpacing:"-0.01em"}}>
                      {overcame?"Overcome":"Gave in"}
                    </div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:12,color:"#7a7068",fontWeight:600}}>{fmtDate(log.ts)}</div>
                    {log.logTime&&<div style={{fontSize:11,color:"#4a4038",marginTop:1}}>{log.logTime}</div>}
                  </div>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:log.wh?10:0}}>
                  {log.emotion&&(
                    <span style={{fontSize:12,fontWeight:600,color:"#8a8078",background:"rgba(255,210,140,0.06)",border:"1px solid rgba(255,210,140,0.1)",borderRadius:20,padding:"3px 10px"}}>{log.emotion}</span>
                  )}
                  {log.location&&(
                    <span style={{fontSize:12,fontWeight:600,color:"#8a8078",background:"rgba(255,210,140,0.06)",border:"1px solid rgba(255,210,140,0.1)",borderRadius:20,padding:"3px 10px"}}>{log.location}</span>
                  )}
                  {log.platform&&(
                    <span style={{fontSize:12,fontWeight:600,color:"#8a8078",background:"rgba(255,210,140,0.06)",border:"1px solid rgba(255,210,140,0.1)",borderRadius:20,padding:"3px 10px"}}>📱 {log.platform}</span>
                  )}
                </div>
                {log.wh&&(
                  <div style={{fontSize:13,color:"#c0b8a8",lineHeight:1.6,borderTop:"0.5px solid rgba(255,210,140,0.07)",paddingTop:10,marginTop:2}}>
                    <span style={{fontWeight:700,color:"#7a7068",fontSize:11,letterSpacing:"0.04em"}}>WHAT HAPPENED  </span>
                    {log.wh}
                  </div>
                )}
                {log.nx&&(
                  <div style={{fontSize:13,color:"#c0b8a8",lineHeight:1.6,marginTop:6}}>
                    <span style={{fontWeight:700,color:"#7a7068",fontSize:11,letterSpacing:"0.04em"}}>NEXT TIME  </span>
                    {log.nx}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── Level page render ──
  if(subPage?.type==="level"){
    const lv=LEVELS.find(l=>l.id===subPage.id);
    const lvIndex=LEVELS.indexOf(lv);
    return(
      <div style={{height:"100%",overflowY:"auto",background:"#141210"}}>
        {/* Back header */}
        <div style={{padding:"16px 18px 0",display:"flex",alignItems:"center",gap:12}}>
          <button onClick={()=>setSubPage(null)} style={{width:36,height:36,borderRadius:"50%",background:"#1e1b17",border:"1.5px solid rgba(255,210,140,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,color:"#ede4d0",flexShrink:0}}>←</button>
          <div style={{fontSize:11,fontWeight:800,color:"#7a7068",letterSpacing:"0.08em"}}>YOUR JOURNEY</div>
        </div>
        <div style={{padding:"16px 18px 56px",display:"flex",flexDirection:"column",gap:18}}>
          {/* Level hero */}
          {lvIndex===0?(
            <>
              <div style={{background:"#1e1b17",borderRadius:22,padding:"16px 18px 14px",color:"#fff",boxShadow:"0 8px 32px rgba(0,0,0,0.18)"}}>
                <div style={{fontSize:20,fontWeight:800,letterSpacing:"-0.02em",marginBottom:2}}>Start Here</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:12}}>{lv.tagline}</div>
                <div style={{height:4,borderRadius:999,background:"rgba(255,255,255,0.1)",overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:999,background:"linear-gradient(90deg,#c8913c,rgba(200,145,60,0.6))",width:`${Math.round(l1Done/l1Items.length*100)}%`,transition:"width 0.8s ease"}}/>
                </div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:5,fontWeight:600}}>{l1Done}/{l1Items.length} complete</div>
              </div>
              {startHereVideo&&(()=>{
                const vimeoId=startHereVideo.match(/vimeo\.com\/(\d+)/)?.[1];
                const ytId=startHereVideo.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?]+)/)?.[1];
                const src=vimeoId?`https://player.vimeo.com/video/${vimeoId}`
                         :ytId?`https://www.youtube.com/embed/${ytId}`
                         :null;
                return src?(
                  <div style={{borderRadius:18,overflow:"hidden",background:"#000",boxShadow:"0 8px 32px rgba(0,0,0,0.4)",aspectRatio:"16/9",position:"relative"}}>
                    <iframe src={src} style={{position:"absolute",inset:0,width:"100%",height:"100%",border:"none"}} allow="autoplay; fullscreen; picture-in-picture" allowFullScreen/>
                  </div>

function VoiceRecorder({onSend}){
  const [recording,setRecording]=useState(false);
  const [duration,setDuration]=useState(0);
  const recRef=useRef(null);
  const chunksRef=useRef([]);
  const timerRef=useRef(null);
  const start=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mimeType=MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":
        MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"";
      const rec=new MediaRecorder(stream,mimeType?{mimeType}:{});
      chunksRef.current=[];
      rec.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
      rec.start(200);
      recRef.current=rec;
      setRecording(true);setDuration(0);
      timerRef.current=setInterval(()=>setDuration(d=>d+1),1000);
    }catch(e){alert("Microphone access required. Please enable it in your browser settings.");}
  };
  const stop=()=>{
    if(!recRef.current)return;
    clearInterval(timerRef.current);
    const mimeType=recRef.current.mimeType||"audio/webm";
    recRef.current.onstop=()=>{
      const blob=new Blob(chunksRef.current,{type:mimeType});
      const reader=new FileReader();
      reader.onloadend=()=>onSend(reader.result);
      reader.readAsDataURL(blob);
    };
    recRef.current.stop();
    recRef.current.stream.getTracks().forEach(t=>t.stop());
    recRef.current=null;
    setRecording(false);setDuration(0);
  };
  const fmt=s=>`${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
  if(recording) return(
    <button onPointerUp={stop} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:8,
      background:"rgba(200,84,26,0.18)",borderRadius:22,padding:"9px 16px",
      border:"1.5px solid rgba(200,84,26,0.45)",color:"#e07060",fontSize:14,fontWeight:700,cursor:"pointer"}}>
      <span style={{width:9,height:9,borderRadius:"50%",background:"#e07060",display:"inline-block",animation:"breathe 0.8s infinite"}}/>
      {fmt(duration)} — Release to send
    </button>
  );
  return(
    <button onPointerDown={start} style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,210,140,0.06)",
      border:"1px solid rgba(255,210,140,0.1)",color:"#7a7068",fontSize:18,
      display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer"}}>🎙</button>
  );
}

  const [playing,setPlaying]=useState(false);
  const [progress,setProgress]=useState(0);
  const audioRef=useRef(null);
  const toggle=()=>{

  return(

        {playing?"⏸":"▶"}

}

function ChatView({me,users,msgs,setMsgs,channelId,dmToId,isChannel}){
  const [inp,setInp]=useState("");
  const [anon,setAnon]=useState(false);
  const [voiceMode,setVoiceMode]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[msgs]);
  const getU=id=>users.find(u=>u.id===id)||{id,name:"Member",color:"#5a5248",badges:[],urges:0};
  const challengeBadges=u=>(u.badges||[]).map(id=>BADGE_DEFS.find(b=>b.id===id&&b.isChallenge)).filter(Boolean);

  const sendText=async()=>{
    if(!inp.trim())return;
    const text=inp.trim();setInp("");
    const tempId="opt_"+Date.now();
    const tempMsg={id:tempId,userId:me.id,fromId:me.id,toId:dmToId,text,isAnn:false,pinned:false,anon,isBadge:false,badgeIcon:null,isVoice:false,channelId,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};
    setMsgs(p=>[...p,tempMsg]);
    try{
      if(isChannel){
        const {data,error}=await sb.from("group_messages").insert({user_id:me.id,text,is_anonymous:anon,is_announcement:false,channel_id:channelId}).select();
        if(error){setMsgs(p=>p.filter(m=>m.id!==tempId));alert("Send failed: "+error.message);}
        else if(data&&data[0]){const m=rowToMsg(data[0]);setMsgs(p=>p.map(x=>x.id===tempId?m:x));}
      } else {
        const {data,error}=await sb.from("direct_messages").insert({from_user_id:me.id,to_user_id:dmToId,text,is_voice:false}).select();
        if(error){setMsgs(p=>p.filter(m=>m.id!==tempId));alert("Send failed: "+error.message);}
        else if(data&&data[0]){const m=rowToDm(data[0]);setMsgs(p=>p.map(x=>x.id===tempId?m:x));}
      }
    }catch(e){
      console.error("[sendText]",e);
      setMsgs(p=>p.filter(m=>m.id!==tempId));
      alert("Send error: "+String(e));
    }
  };

  const sendVoice=async(voiceData)=>{
    const tempId="opt_"+Date.now();
    const tempMsg={id:tempId,userId:me.id,fromId:me.id,toId:dmToId,text:"🎙 Voice message",isVoice:true,voiceData,isAnn:false,pinned:false,anon:false,isBadge:false,badgeIcon:null,channelId,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};
    setMsgs(p=>[...p,tempMsg]);
    if(isChannel){
      const {data,error}=await sb.from("group_messages").insert({user_id:me.id,is_anonymous:false,is_announcement:false,channel_id:channelId,is_voice:true,voice_data:voiceData,text:"🎙 Voice message"}).select();
      if(error){setMsgs(p=>p.filter(m=>m.id!==tempId));}
      else if(data&&data[0])setMsgs(p=>p.map(m=>m.id===tempId?rowToMsg(data[0]):m));
    } else {
      const {data,error}=await sb.from("direct_messages").insert({from_user_id:me.id,to_user_id:dmToId,is_voice:true,voice_data:voiceData,text:"🎙 Voice message"}).select();
      if(error){setMsgs(p=>p.filter(m=>m.id!==tempId));}
      else if(data&&data[0])setMsgs(p=>p.map(m=>m.id===tempId?rowToDm(data[0]):m));
    }
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:"#141210"}}>
      <div style={{flex:1,overflowY:"auto",padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
        {msgs.map(msg=>{
          const senderId=isChannel?(msg.userId):(msg.fromId||msg.userId);
          const u=getU(senderId);
          const isMe=u.id===me.id;
          const showAnon=msg.anon&&!isMe;
          const cBadges=showAnon?[]:challengeBadges(u);
          if(msg.isAnn) return(
            <div key={msg.id} style={{background:"#1e1b17",border:"1px solid rgba(255,210,140,0.1)",borderRadius:18,padding:"13px 16px",textAlign:"center"}}>
              {msg.pinned&&<div style={{fontSize:11,fontWeight:700,color:"#8a8078",marginBottom:5,letterSpacing:"0.08em"}}>📌 PINNED</div>}
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:7,marginBottom:5}}>
                <Avatar user={u} size={20}/><span style={{fontSize:11,fontWeight:700,color:"#c0b8a8"}}>Coach {u.name}</span>
              </div>
              <div style={{fontSize:13,color:"#ede4d0",lineHeight:1.55}}>{msg.text}</div>
              <div style={{fontSize:11,color:"#7a7068",marginTop:7}}>{msg.time}</div>
            </div>
          );
          if(msg.isBadge) return(
            <div key={msg.id} style={{background:"rgba(107,136,112,0.12)",border:"1.5px solid rgba(200,145,60,0.28)",borderRadius:18,padding:"14px 16px",textAlign:"center"}}>
              <div style={{fontSize:32,marginBottom:5}}>{msg.badgeIcon}</div>
              <div style={{fontWeight:700,fontSize:14,color:"#c8913c",lineHeight:1.4}}>{msg.text}</div>
              <div style={{fontSize:11,color:"#8a8078",marginTop:5}}>{msg.time}</div>
            </div>
          );
          return(
            <div key={msg.id} style={{display:"flex",alignItems:"flex-end",gap:8,flexDirection:isMe?"row-reverse":"row"}}>
              {!isMe&&(showAnon
                ?<div style={{width:32,height:32,borderRadius:"50%",background:"#2a2018",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>👤</div>
                :<Avatar user={u} size={32}/>)}
              <div style={{display:"flex",flexDirection:"column",alignItems:isMe?"flex-end":"flex-start",maxWidth:"76%"}}>
                {!isMe&&(
                  <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4}}>
                    <span style={{fontSize:12,fontWeight:700,color:showAnon?"#4a4038":"#c0b8a8"}}>{showAnon?"Anonymous":u.name}</span>
                    {!showAnon&&u.urges!==undefined&&<span style={{fontSize:11,color:"#7a7068"}}>🔴 {u.urges}</span>}
                    {cBadges.map(b=><span key={b.id} title={b.label} style={{fontSize:12}}>{b.icon}</span>)}
                  </div>
                )}
                {msg.isVoice&&msg.voiceData
                  ?<VoiceMessage data={msg.voiceData} isMe={isMe}/>
                  :<div style={{borderRadius:20,padding:"9px 15px",fontSize:15,lineHeight:1.45,
                    background:isMe?"#2a2018":"#252118",color:isMe?"#ede4d0":"#c0b8a8",
                    borderBottomRightRadius:isMe?5:20,borderBottomLeftRadius:isMe?20:5,
                    boxShadow:isMe?"0 2px 8px rgba(0,0,0,0.18)":"0 1px 4px rgba(0,0,0,0.07)"}}>{msg.text}</div>}
                <div style={{fontSize:11,color:"#7a7068",marginTop:4}}>{msg.time}</div>
              </div>
            </div>
          );
        })}
        <div ref={endRef}/>
      </div>
      <div className="frosted-light" style={{padding:"10px 14px",borderTop:"0.5px solid rgba(255,210,140,0.07)",display:"flex",flexDirection:"column",gap:6}}>
        {isChannel&&anon&&<div style={{fontSize:11,color:"#7a7068",textAlign:"center",fontWeight:600}}>👤 Posting anonymously</div>}
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {isChannel&&<button onClick={()=>setAnon(a=>!a)} style={{width:36,height:36,borderRadius:"50%",background:anon?"#c8541a":"rgba(255,210,140,0.06)",border:"none",fontSize:15,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",color:anon?"#fff":"#4a4038"}}>👤</button>}
          {voiceMode
            ?<VoiceRecorder onSend={data=>{sendVoice(data);setVoiceMode(false);}}/>
            :<input style={{flex:1,background:"rgba(255,210,140,0.05)",borderRadius:22,padding:"9px 16px",fontSize:15,border:"1px solid rgba(255,210,140,0.08)",outline:"none",color:"#ede4d0"}}
              placeholder={isChannel?(anon?"Message anonymously...":"Message the group..."):"Message..."}
              value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendText()}/>}
          <button onClick={()=>setVoiceMode(v=>!v)} style={{width:36,height:36,borderRadius:"50%",background:voiceMode?"rgba(200,145,60,0.25)":"rgba(255,210,140,0.06)",border:voiceMode?"1px solid rgba(200,145,60,0.5)":"1px solid rgba(255,210,140,0.1)",color:voiceMode?"#c8913c":"#7a7068",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>🎙</button>
          {!voiceMode&&<button onClick={sendText} style={{width:36,height:36,borderRadius:"50%",background:"#1e1b17",border:"none",color:"#fff",fontSize:18,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>↑</button>}
        </div>
      </div>
    </div>
  );
}

function MessagesScreen({me,users,channels,groupMsgs,setGroupMsgs,dmMsgs,setDmMsgs,openChannelSlug,setOpenChannelSlug}){
  const initCh=openChannelSlug?channels.find(c=>c.slug===openChannelSlug)||null:null;
  const [view,setView]=useState(initCh?"channel":"list");
  const [activeChannel,setActiveChannel]=useState(initCh);
  const [activeDmUid,setActiveDmUid]=useState(null);
  useEffect(()=>{if(openChannelSlug&&setOpenChannelSlug)setOpenChannelSlug(null);},[]);

  const hunter=users.find(u=>u.id===HUNTER_UUID);
  const otherUsers=users.filter(u=>u.id!==me.id&&u.id!==HUNTER_UUID);
  const getChannelMsgs=ch=>groupMsgs.filter(m=>m.channelId===ch.id);
  const getDmThread=uid=>{const k=dmKey(me.id,uid);return dmMsgs[k]||[];};
  const hunterUnreadCount=hunter?getDmThread(hunter.id).filter(m=>!m.isRead&&m.fromId===HUNTER_UUID).length:0;

  const openChannel=ch=>{setActiveChannel(ch);setView("channel");};
  const openDm=async uid=>{
    setActiveDmUid(uid);setView("dm");
    if(uid===HUNTER_UUID){
      await sb.from("direct_messages").update({is_read:true}).eq("to_user_id",me.id).eq("from_user_id",uid).is("is_read",false);
      const k=dmKey(me.id,uid);
      setDmMsgs(p=>({...p,[k]:(p[k]||[]).map(m=>m.fromId===uid?{...m,isRead:true}:m)}));
    }
  };
  const back=()=>{setView("list");setActiveChannel(null);setActiveDmUid(null);};

  if(view==="channel"&&activeChannel){
    const chanMsgs=getChannelMsgs(activeChannel);
    const setChanMsgs=fn=>setGroupMsgs(all=>{
      const others=all.filter(m=>m.channelId!==activeChannel.id);
      const these=typeof fn==="function"?fn(all.filter(m=>m.channelId===activeChannel.id)):fn;
      return[...others,...these];
    });
    return(
      <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
        <MsgSubHeader name={`# ${activeChannel.name}`} subtitle={activeChannel.desc||"Group channel"} onBack={back}/>
        <ChatView me={me} users={users} msgs={chanMsgs} setMsgs={setChanMsgs} channelId={activeChannel.id} isChannel={true}/>
      </div>
    );
  }

  if(view==="dm"&&activeDmUid!==null){
    const dmUser=users.find(u=>u.id===activeDmUid);
    const k=dmKey(me.id,activeDmUid);
    const thread=dmMsgs[k]||[];
    const setThread=fn=>setDmMsgs(p=>({...p,[k]:typeof fn==="function"?fn(p[k]||[]):fn}));
    return(
      <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
        <MsgSubHeader
          name={dmUser?dmUser.name:"..."}
          subtitle={dmUser?.id===HUNTER_UUID?"👑 Your Coach":dmUser?"🔴 "+dmUser.urges+" urges overcome":""}
          left={dmUser&&<Avatar user={dmUser} size={34}/>}
          onBack={back}/>
        <ChatView me={me} users={users} msgs={thread} setMsgs={setThread} dmToId={activeDmUid} isChannel={false}/>
      </div>
    );
  }

  // ── List view ──
  const generalCh=channels.find(c=>c.slug==="general");
  const otherChs=channels.filter(c=>c.slug!=="general");

  return(
    <div style={{height:"100%",overflowY:"auto",background:"#141210",paddingBottom:16}}>
      <div style={{padding:"16px 16px 8px",fontSize:11,fontWeight:700,color:"#6a6058",letterSpacing:"0.08em"}}>📌 PINNED</div>
      {generalCh&&<MsgConvoRow icon="💬" name="# general" preview={getChannelMsgs(generalCh).at(-1)?.text} pinned onClick={()=>openChannel(generalCh)}/>}
      {hunter&&<MsgConvoRow icon={<Avatar user={hunter} size={44}/>} name="Coach Hunter" preview={getDmThread(hunter.id).at(-1)?.text||"Tap to message your coach"} badge={hunterUnreadCount} pinned onClick={()=>openDm(hunter.id)}/>}

      <div style={{padding:"16px 16px 8px",fontSize:11,fontWeight:700,color:"#6a6058",letterSpacing:"0.08em"}}>CHANNELS</div>
      {otherChs.map(ch=>(
        <MsgConvoRow key={ch.id} icon="＃" name={ch.name} preview={getChannelMsgs(ch).at(-1)?.text} onClick={()=>openChannel(ch)}/>
      ))}

      <div style={{padding:"16px 16px 8px",fontSize:11,fontWeight:700,color:"#6a6058",letterSpacing:"0.08em"}}>DIRECT MESSAGES</div>
      {otherUsers.map(u=>(
        <MsgConvoRow key={u.id} icon={<Avatar user={u} size={44}/>} name={u.name} preview={getDmThread(u.id).at(-1)?.text||"No messages yet"} onClick={()=>openDm(u.id)}/>
      ))}
      {otherUsers.length===0&&<div style={{textAlign:"center",padding:"24px",color:"#7a7068",fontSize:13}}>Other members will appear here</div>}
    </div>
  );
}

            placeholder={anon?"Message anonymously...":"Message the group..."} value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
          <button onClick={send} style={{width:36,height:36,borderRadius:"50%",background:"#1e1b17",border:"none",color:"#fff",fontSize:18,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>↑</button>
        </div>
      </div>
    </div>
  );
}

// ─── Messages ─────────────────────────────────────────────────────────────────

function Messages({me,users,dms,setDms,activeDm,setActiveDm,onProfile,onSOS}){
  const [inp,setInp]=useState("");
  const endRef=useRef(null);
  const partner=users.find(u=>u.id===me.partnerId);
  const k=activeDm?dmKey(me.id,activeDm):null;
  const thread=k?(dms[k]||[]):[];
  const other=activeDm?users.find(u=>u.id===activeDm):null;
  useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[thread,activeDm]);
  const send=()=>{
    if(!inp.trim()||!k) return;
    setDms(p=>({...p,[k]:[...(p[k]||[]),{id:Date.now(),from:me.id,text:inp,time:now()}]}));
    setInp("");
  };
  const myConvos=Object.entries(dms)
    .filter(([key])=>{const[a,b]=key.split("-").map(Number);return a===me.id||b===me.id;})
    .map(([key,msgs])=>{const[a,b]=key.split("-").map(Number);const uid=a===me.id?b:a;return{uid,user:users.find(u=>u.id===uid),last:msgs.at(-1)};});

  if(activeDm&&other) return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div className="frosted-light" style={{borderBottom:"0.5px solid rgba(0,0,0,0.1)",padding:"12px 18px",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={()=>setActiveDm(null)} style={{background:"none",border:"none",fontSize:24,color:"#c0b8a8",padding:0,fontWeight:300}}>←</button>
        <Avatar user={other} size={38} onClick={()=>onProfile(other)}/>
        <div style={{cursor:"pointer",flex:1}} onClick={()=>onProfile(other)}>
          <div style={{fontWeight:700,fontSize:16,color:"#ede4d0",letterSpacing:"-0.01em"}}>{other.name}{other.id===me.partnerId?" 🤝":""}</div>
          <div style={{fontSize:11,color:"#7a7068",fontWeight:500}}>🔴 {other.urges} urges overcome</div>
        </div>
        {other.id===me.partnerId&&<button onClick={onSOS} style={{background:"rgba(157,61,46,0.15)",border:"1.5px solid rgba(157,61,46,0.4)",color:"#e07060",borderRadius:22,padding:"7px 13px",fontSize:12,fontWeight:800}}>🚨 SOS</button>}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"12px 14px",display:"flex",flexDirection:"column",gap:10,background:"#141210"}}>
        {thread.map(msg=>{
          const isMe=msg.from===me.id;
          return(
            <div key={msg.id} style={{display:"flex",alignItems:"flex-end",gap:8,flexDirection:isMe?"row-reverse":"row"}}>
              {!isMe&&<Avatar user={other} size={28}/>}
              <div style={{display:"flex",flexDirection:"column",alignItems:isMe?"flex-end":"flex-start",maxWidth:"76%"}}>
                <div style={{borderRadius:20,padding:"9px 15px",fontSize:15,lineHeight:1.45,
                  background:isMe?"#2a2018":"#252118",color:isMe?"#ede4d0":"#c0b8a8",
                  borderBottomRightRadius:isMe?5:20,borderBottomLeftRadius:isMe?20:5,
                  boxShadow:isMe?"0 2px 8px rgba(0,0,0,0.18)":"0 1px 4px rgba(0,0,0,0.07)"}}>{msg.text}</div>
                <div style={{fontSize:11,color:"#7a7068",marginTop:4}}>{msg.time}</div>
              </div>
            </div>
          );
        })}
        <div ref={endRef}/>
      </div>
      <div className="frosted-light" style={{padding:"10px 14px",borderTop:"0.5px solid rgba(255,210,140,0.07)",display:"flex",gap:8,alignItems:"center"}}>
        <input style={{flex:1,background:"rgba(255,210,140,0.05)",borderRadius:22,padding:"9px 16px",fontSize:15,border:"1px solid rgba(255,210,140,0.08)",outline:"none",color:"#ede4d0"}}
          placeholder={`Message ${other.name}...`} value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
        <button onClick={send} style={{width:36,height:36,borderRadius:"50%",background:"#1e1b17",border:"none",color:"#fff",fontSize:18,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>↑</button>
      </div>
    </div>
  );

  return(
    <div style={{background:"#141210",height:"100%",overflowY:"auto"}}>
      {partner&&(
        <>
          <div style={{padding:"14px 18px 5px",fontSize:11,fontWeight:700,color:"#7a7068",letterSpacing:"0.08em"}}>ACCOUNTABILITY PARTNER</div>
          <div onClick={()=>setActiveDm(partner.id)} style={{margin:"0 14px 4px",background:"#1e1b17",borderRadius:18,padding:"14px 16px",display:"flex",alignItems:"center",gap:13,cursor:"pointer",boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
            <div style={{position:"relative"}}>
              <Avatar user={partner} size={52} ring/>
              <div style={{position:"absolute",bottom:1,right:1,width:13,height:13,borderRadius:"50%",background:"#c8913c",border:"2.5px solid #1e1b17"}}/>
            </div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:16,color:"#ede4d0",letterSpacing:"-0.01em"}}>{partner.name} 🤝</div>
              <div style={{fontSize:13,color:"#7a7068",marginTop:2}}>{(dms[dmKey(me.id,partner.id)]||[]).at(-1)?.text||"Start a conversation"}</div>
            </div>
            <button onClick={e=>{e.stopPropagation();onSOS();}} style={{background:"rgba(157,61,46,0.15)",border:"1.5px solid rgba(157,61,46,0.4)",color:"#e07060",borderRadius:22,padding:"7px 12px",fontSize:12,fontWeight:800,flexShrink:0}}>🚨 SOS</button>
          </div>
        </>
      )}
      {myConvos.filter(c=>c.uid!==partner?.id&&c.user).length>0&&(
        <div style={{padding:"16px 18px 5px",fontSize:11,fontWeight:700,color:"#7a7068",letterSpacing:"0.08em"}}>MESSAGES</div>
      )}
      {myConvos.filter(c=>c.uid!==partner?.id&&c.user).map(({uid,user:u,last})=>(
        <div key={uid} onClick={()=>setActiveDm(uid)} style={{margin:"0 14px 4px",background:"#1e1b17",borderRadius:18,padding:"13px 16px",display:"flex",alignItems:"center",gap:13,cursor:"pointer",boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
          <Avatar user={u} size={50}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:15,color:"#ede4d0"}}>{u.name}</div>
            <div style={{fontSize:13,color:"#7a7068",marginTop:2}}>{last?.text||""}</div>
          </div>
        </div>
      ))}
      {myConvos.length===0&&!partner&&(
        <div style={{textAlign:"center",padding:"60px 32px",color:"#7a7068"}}>
          <div style={{fontSize:44,marginBottom:14}}>✉️</div>
          <div style={{fontSize:17,fontWeight:700,color:"#c0b8a8",marginBottom:8,letterSpacing:"-0.01em"}}>No messages yet</div>
          <div style={{fontSize:14,lineHeight:1.5}}>Tap a name in Group Chat to start a conversation</div>
        </div>
      )}
    </div>
  );
}

// ─── Library helpers (defined outside Library to prevent remount on re-render) ─

const LIB_TYPE_ICON  ={article:"📄",video:"🎬",challenge:"🏋️"};
const LIB_TYPE_COLOR ={article:"#eff6ff",video:"#f5f3ff",challenge:"#f0fdf4"};
const LIB_TYPE_BORDER={article:"#bfdbfe",video:"#ddd6fe",challenge:"#bbf7d0"};
const LIB_TYPE_LABEL ={article:"#1d4ed8",video:"#6d28d9",challenge:"#15803d"};

  return(
    <>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {["article","video","challenge"].map(t=>(
          <button key={t} onClick={()=>set("type",t)} style={{flex:1,padding:"9px 4px",borderRadius:10,border:"1.5px solid",fontSize:12,fontWeight:700,

            {LIB_TYPE_ICON[t]} {t}
          </button>

      </div>
      <input placeholder="Title *" value={vals.title} onChange={e=>set("title",e.target.value)} style={{width:"100%",padding:"12px 14px",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:12,fontSize:15,outline:"none",marginBottom:10,color:"#ede4d0",background:"#252118"}}/>
      {vals.type==="video"&&<input placeholder="Vimeo or YouTube URL" value={vals.url} onChange={e=>set("url",e.target.value)} style={{width:"100%",padding:"12px 14px",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:12,fontSize:15,outline:"none",marginBottom:10,color:"#ede4d0",background:"#252118"}}/>}
      <textarea placeholder="Description / content..." value={vals.body} onChange={e=>set("body",e.target.value)} rows={4} style={{width:"100%",padding:"12px 14px",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:12,fontSize:15,outline:"none",resize:"none",marginBottom:10,color:"#ede4d0",background:"#252118",fontFamily:"inherit"}}/>
      {vals.type==="challenge"&&(
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <input placeholder="Badge emoji" value={vals.badgeIcon} onChange={e=>set("badgeIcon",e.target.value)} style={{width:110,padding:"12px 14px",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:12,fontSize:15,outline:"none",color:"#ede4d0",background:"#252118"}}/>
          <input placeholder="Badge name" value={vals.badgeLabel} onChange={e=>set("badgeLabel",e.target.value)} style={{flex:1,padding:"12px 14px",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:12,fontSize:15,outline:"none",color:"#ede4d0",background:"#252118"}}/>
        </div>
      )}

  );
}

function LibraryModal({title,onClose,onSave,vals,set}){
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#1e1b17",borderRadius:"24px 24px 0 0",padding:"22px 22px 44px",width:"100%",maxWidth:390,animation:"springUp 0.36s cubic-bezier(0.34,1.2,0.64,1)",maxHeight:"85vh",overflowY:"auto"}}>

      </div>
    </div>
