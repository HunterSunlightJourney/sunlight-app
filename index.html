}

// ─── Library ──────────────────────────────────────────────────────────────────

function Library({me,library,setLibrary,callLink,onBadgeEarned}){
  const [open,   setOpen]   =useState(null);
  const [adding, setAdding] =useState(false);
  const [editing,setEditing]=useState(null);
  const [newPost,setNewPost]=useState({type:"article",title:"",body:"",url:"",badgeIcon:"",badgeLabel:""});
  const [editForm,setEditForm]=useState({type:"article",title:"",body:"",url:"",badgeIcon:"",badgeLabel:""});
  const setNP=(k,v)=>setNewPost(p=>({...p,[k]:v}));
  const setEF=(k,v)=>setEditForm(p=>({...p,[k]:v}));

  const typeIcon  =LIB_TYPE_ICON;
  const typeColor =LIB_TYPE_COLOR;
  const typeBorder=LIB_TYPE_BORDER;
  const typeLabel =LIB_TYPE_LABEL;

  const addPost=async()=>{
    if(!newPost.title.trim()) return;
    const badgeId=newPost.type==="challenge"&&newPost.badgeLabel?`ch-custom-${Date.now()}`:null;
    const {data,error}=await sb.from("library_items").insert({
      type:newPost.type, title:newPost.title, body:newPost.body||null,
      video_url:newPost.type==="video"?(newPost.url||null):null,
      badge_id:badgeId, badge_icon:newPost.badgeIcon||null, badge_label:newPost.badgeLabel||null,
      sort_order:library.length+1,
    }).select();
    if(!error&&data&&data[0]) setLibrary(p=>[...p,rowToLibraryItem(data[0])]);
    setAdding(false);
    setNewPost({type:"article",title:"",body:"",url:"",badgeIcon:"",badgeLabel:""});
  };

  const saveEdit=async()=>{
    if(!editForm.title.trim()||!editing) return;
    const badgeId=editForm.type==="challenge"&&editForm.badgeLabel?(editing.badgeId||`ch-custom-${editing.id}`):null;
    const {error}=await sb.from("library_items").update({
      type:editForm.type, title:editForm.title, body:editForm.body||null,
      video_url:editForm.type==="video"?(editForm.url||null):null,
      badge_id:badgeId, badge_icon:editForm.badgeIcon||null, badge_label:editForm.badgeLabel||null,
    }).eq("id",editing.id);
    if(!error) setLibrary(p=>p.map(x=>x.id!==editing.id?x:{
      ...x,type:editForm.type,title:editForm.title,body:editForm.body,url:editForm.url,
      badgeId:badgeId||undefined,badgeIcon:editForm.badgeIcon||undefined,badgeLabel:editForm.badgeLabel||undefined,
    }));
    setEditing(null);
  };

  const deleteItem=async(item)=>{
    if(!window.confirm("Delete this training?")) return;
    await sb.from("library_items").delete().eq("id",item.id);
    setLibrary(p=>p.filter(x=>x.id!==item.id));
    setOpen(null);
  };

  const toggleComplete=async(item)=>{
    const wasDone=item.completions.includes(me.id);
    if(wasDone){
      await sb.from("library_completions").delete().eq("item_id",item.id).eq("user_id",me.id);
    } else {
      await sb.from("library_completions").insert({item_id:item.id,user_id:me.id});
      if(item.type==="challenge"&&item.badgeId) onBadgeEarned(item);
    }
    setLibrary(p=>p.map(x=>x.id!==item.id?x:{...x,completions:wasDone?x.completions.filter(c=>c!==me.id):[...x.completions,me.id]}));
  };


  const ContentCard=({item})=>{
    const isOpen=open===item.id;
    const done=item.completions.includes(me.id);
    return(
      <div className="card" style={{overflow:"hidden",marginBottom:10}}>
        <div onClick={()=>setOpen(isOpen?null:item.id)} style={{padding:"15px 16px",cursor:"pointer",display:"flex",alignItems:"flex-start",gap:13}}>
          <div style={{width:40,height:40,borderRadius:12,background:typeColor[item.type],border:`1px solid ${typeBorder[item.type]}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{typeIcon[item.type]}</div>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
              <div style={{fontSize:10,fontWeight:800,color:typeLabel[item.type],background:typeColor[item.type],border:`1px solid ${typeBorder[item.type]}`,borderRadius:22,padding:"2px 9px",letterSpacing:"0.04em"}}>{item.type.toUpperCase()}</div>
              {item.badgeId&&<div style={{fontSize:10,color:"#c8913c",background:"rgba(107,136,112,0.12)",border:"1px solid rgba(200,145,60,0.2)",borderRadius:22,padding:"2px 8px",fontWeight:700}}>+{item.badgeIcon} badge</div>}
              {done&&<div style={{fontSize:10,fontWeight:800,color:"#c8913c"}}>✓ Done</div>}
            </div>
            <div style={{fontWeight:700,fontSize:15,color:"#ede4d0",lineHeight:1.3,letterSpacing:"-0.01em"}}>{item.title}</div>
            <div style={{fontSize:11,color:"#7a7068",marginTop:3,fontWeight:500}}>{item.date} · {item.completions.length} completed</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            {me.isAdmin&&<button onClick={e=>{e.stopPropagation();setEditing(item);setEditForm({type:item.type,title:item.title,body:item.body||"",url:item.url||"",badgeIcon:item.badgeIcon||"",badgeLabel:item.badgeLabel||""});}} style={{background:"none",border:"none",fontSize:15,color:"#7a7068",padding:"4px 6px",cursor:"pointer"}}>✏️</button>}
            <div style={{fontSize:13,color:"#4a4038",fontWeight:700,transition:"transform 0.2s",transform:isOpen?"rotate(180deg)":"none"}}>▼</div>
          </div>
        </div>
        {isOpen&&(
          <div style={{padding:"0 16px 16px",borderTop:"0.5px solid rgba(0,0,0,0.07)"}}>
            {item.body&&<div style={{fontSize:14,color:"#c0b8a8",lineHeight:1.7,marginTop:14,whiteSpace:"pre-line"}}>{item.body}</div>}
            {item.type==="video"&&item.url&&(
              <a href={item.url} target="_blank" rel="noreferrer" style={{display:"block",marginTop:14,padding:"13px 16px",background:"#1a1714",borderRadius:12,fontSize:14,color:"#ede4d0",fontWeight:700,textDecoration:"none",textAlign:"center",letterSpacing:"-0.01em"}}>▶ Watch Video →</a>
            )}
            <button onClick={()=>toggleComplete(item)} style={{width:"100%",marginTop:12,padding:12,borderRadius:12,
              background:done?"rgba(200,145,60,0.14)":"#252118",color:done?"#c8913c":"#ede4d0",
              border:done?"1.5px solid rgba(200,145,60,0.35)":"1.5px solid rgba(255,210,140,0.07)",fontSize:14,fontWeight:700,letterSpacing:"-0.01em"}}>
              {done?"✓ Marked complete":(item.type==="challenge"&&item.badgeId?`Complete & earn ${item.badgeIcon}`:"Mark as done")}
            </button>
            {me.isAdmin&&<button onClick={()=>deleteItem(item)} style={{width:"100%",marginTop:8,padding:10,borderRadius:12,background:"rgba(157,61,46,0.1)",color:"#e07060",border:"1px solid rgba(157,61,46,0.2)",fontSize:13,fontWeight:700}}>Delete</button>}
          </div>
        )}
      </div>
    );
  };

  const challenges=library.filter(i=>i.type==="challenge");
  const resources =library.filter(i=>i.type!=="challenge");


  return(
    <div style={{height:"100%",overflowY:"auto",background:"#141210"}}>

      {/* Challenges */}
      <div style={{padding:"18px 16px 8px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontWeight:800,fontSize:17,color:"#ede4d0",letterSpacing:"-0.02em"}}>🏋️ Challenges</div>
        {me.isAdmin&&<button onClick={()=>setAdding(true)} style={{background:"#1e1b17",color:"#fff",border:"none",borderRadius:22,padding:"7px 16px",fontSize:12,fontWeight:700}}>+ Add</button>}
      </div>
      <div style={{padding:"0 16px 2px",fontSize:12,color:"#7a7068",fontWeight:500,marginBottom:8}}>Complete challenges to earn badges next to your name.</div>
      <div style={{padding:"0 16px"}}>{challenges.map(item=><ContentCard key={item.id} item={item}/>)}</div>

      {/* Resources */}
      <div style={{padding:"16px 16px 8px"}}>
        <div style={{fontWeight:800,fontSize:17,color:"#ede4d0",letterSpacing:"-0.02em"}}>📚 Resources</div>
      </div>
      <div style={{padding:"0 16px"}}>{resources.map(item=><ContentCard key={item.id} item={item}/>)}</div>

      {/* Book a Call */}
      <div style={{padding:"8px 16px 0"}}>
        <div style={{fontWeight:800,fontSize:17,color:"#ede4d0",marginBottom:5,letterSpacing:"-0.02em"}}>📅 Book a 1:1 Call</div>
        <div style={{fontSize:13,color:"#7a7068",marginBottom:14,fontWeight:500}}>30 min with Coach Hunter</div>
        {callLink?(
          <a href={callLink} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:18,borderRadius:16,background:"#1e1b17",color:"#fff",fontSize:16,fontWeight:800,textDecoration:"none",letterSpacing:"-0.01em",boxShadow:"0 4px 16px rgba(0,0,0,0.2)"}}>
            📅 Book a Call →
          </a>
        ):(
          <div style={{background:"#1e1b17",border:"1.5px dashed rgba(255,210,140,0.15)",borderRadius:16,padding:22,textAlign:"center"}}>
            <div style={{fontSize:13,color:"#7a7068",lineHeight:1.6}}>{me.isAdmin?"Add your booking link in ⚙️ Admin → Settings.":"Booking link coming soon."}</div>
          </div>
        )}
      </div>

      {adding&&<LibraryModal title="New Training" onClose={()=>setAdding(false)} onSave={addPost} vals={newPost} set={setNP}/>}
      {editing&&<LibraryModal title="Edit Training" onClose={()=>setEditing(null)} onSave={saveEdit} vals={editForm} set={setEF}/>}

      <div style={{height:48}}/>
    </div>
  );
}

// ─── Red Button ───────────────────────────────────────────────────────────────

function Confetti(){
  const em=["🎉","⭐","💪","🌟","✨","🏆","🎊","🌅","🔥","💎"];
  return(
    <div style={{position:"absolute",inset:0,pointerEvents:"none",overflow:"hidden"}}>
      {Array.from({length:20},(_,i)=>(
        <div key={i} style={{position:"absolute",fontSize:22,left:`${i*5.2}%`,top:"-8%",animation:`fall ${1+Math.random()*0.6}s ${(i*0.07).toFixed(2)}s infinite linear`}}>{em[i%em.length]}</div>
      ))}
    </div>
  );
}

function RedButton({me,goToMessages,urges,onOvercome,onLogSaved,startState,onStartConsumed}){
  const [state,       setState]    =useState(startState||"idle");
  useEffect(()=>{
    if(startState&&startState!=="idle"&&onStartConsumed) onStartConsumed();
    if(startState==="gave-in-journal") setLogTime(new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
  },[]);
  const [left,        setLeft]     =useState(DEMO_SECS);
  const [wh,          setWh]       =useState("");
  const [nx,          setNx]       =useState("");
  const [selEmo,      setEmo]      =useState("");
  const [bl,          setBl]       =useState(BLOCKLIST.reduce((a,k)=>({...a,[k]:true}),{}));
  const [blOpen,      setBlOpen]   =useState(false);
  // reflect form
  const [logTime,     setLogTime]  =useState("");
  const [location,    setLocation] =useState("");
  const [triggerType, setTrigType] =useState(""); // "thought" | "saw"
  const [platform,    setPlatform] =useState("");
  // commitment (persists through reset)
  const [commitment,  setCommitment]=useState(null); // {dueAt, label}
  const tmr=useRef(null);

  useEffect(()=>{
    if(state!=="away") return;
    tmr.current=setInterval(()=>setLeft(t=>{if(t<=1){clearInterval(tmr.current);setState("checkin");return 0;}return t-1;}),1000);
    return()=>clearInterval(tmr.current);
  },[state]);

  // Fire commitment check-in once time is up — works even if they've been on another tab
  useEffect(()=>{
    if(!commitment||state!=="idle") return;
    if(Date.now()>=commitment.dueAt){setState("commitment-checkin");return;}
    const t=setTimeout(()=>setState("commitment-checkin"),commitment.dueAt-Date.now());
    return()=>clearTimeout(t);
  },[commitment,state]);

  const saveLog=(outcome)=>{
    onLogSaved({id:Date.now(),ts:Date.now(),logTime,location,triggerType,platform:triggerType==="saw"?platform:null,emotion:selEmo,wh,nx,outcome});
    setEmo("");setWh("");setNx("");
  };
  const reset=()=>{
    setState("idle");setWh("");setNx("");setLeft(DEMO_SECS);
    setEmo("");setLogTime("");setLocation("");setTrigType("");setPlatform("");
    // NOTE: commitment intentionally not cleared here — it persists until answered
  };

  const autoTime=()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const openReflect=()=>{setLogTime(autoTime());setState("reflect");};

  const C={display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flex:1,padding:"0 28px",textAlign:"center",gap:24};
  const PBtn=({l,o,c="#c8541a",shadow})=><button onClick={o} style={{width:"100%",padding:17,borderRadius:16,background:c,color:"#fff",border:"none",fontSize:15,fontWeight:700,marginBottom:10,letterSpacing:"0.01em",boxShadow:shadow||`0 4px 20px rgba(0,0,0,0.3)`}}>{l}</button>;
  const SBtn=({l,o})=><button onClick={o} style={{width:"100%",padding:16,borderRadius:16,background:"rgba(255,210,140,0.05)",color:"#c0b8a8",border:"1px solid rgba(255,210,140,0.1)",fontSize:15,fontWeight:500,marginBottom:10,letterSpacing:"0.01em"}}>{l}</button>;
  const GBtn=({l,o})=><button onClick={o} style={{background:"none",border:"none",fontSize:14,color:"#4a4038",cursor:"pointer",padding:8,fontWeight:400,letterSpacing:"0.02em"}}>{l}</button>;
  const Chip=({label,sel,onSel,color="#c8541a"})=>(
    <button onClick={onSel} style={{padding:"8px 15px",borderRadius:22,fontSize:13,fontWeight:sel?600:400,border:"1px solid",
      background:sel?color:"rgba(255,210,140,0.04)",color:sel?"#fff":"#8a8078",borderColor:sel?color:"rgba(255,210,140,0.1)",whiteSpace:"nowrap"}}>{label}</button>
  );

  const nm=nextMilestone(urges);

  // ── Reflect form (immediate after pressing button) ──
  if(state==="reflect"){
    const canContinue=logTime&&location&&triggerType&&(triggerType==="thought"||(triggerType==="saw"&&platform));
    return(
      <div style={{flex:1,overflowY:"auto",background:"#141210"}}>
        <div style={{padding:"22px 20px 40px",display:"flex",flexDirection:"column",gap:22}}>
          <div>
            <div style={{fontWeight:800,fontSize:22,color:"#ede4d0",marginBottom:4,letterSpacing:"-0.02em"}}>Let's understand this urge.</div>
            <div style={{fontSize:14,color:"#7a7068",fontWeight:500}}>Be honest with yourself.</div>
          </div>

          {/* What time is it */}
          <div className="card" style={{padding:"16px 18px"}}>
            <div style={{fontSize:11,fontWeight:800,color:"#7a7068",marginBottom:10,letterSpacing:"0.08em"}}>WHAT TIME IS IT?</div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <input value={logTime} onChange={e=>setLogTime(e.target.value)}
                style={{flex:1,background:"#252118",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:10,padding:"10px 14px",fontSize:15,outline:"none",color:"#ede4d0",fontWeight:600}}/>
              <button onClick={()=>setLogTime(autoTime())} style={{background:"#1a1714",border:"none",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#c0b8a8",fontWeight:700}}>Now</button>
            </div>
          </div>

          {/* Where are you */}
          <div className="card" style={{padding:"16px 18px"}}>
            <div style={{fontSize:11,fontWeight:800,color:"#7a7068",marginBottom:12,letterSpacing:"0.08em"}}>WHERE ARE YOU?</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
              {LOCATIONS.map(l=><Chip key={l} label={l} sel={location===l} onSel={()=>setLocation(l)}/>)}
            </div>
          </div>

          {/* What triggered it */}
          <div className="card" style={{padding:"16px 18px"}}>
            <div style={{fontSize:11,fontWeight:800,color:"#7a7068",marginBottom:12,letterSpacing:"0.08em"}}>WHAT TRIGGERED IT?</div>
            <div style={{display:"flex",gap:10,marginBottom:triggerType==="saw"?14:0}}>
              <button onClick={()=>{setTrigType("thought");setPlatform("");}} style={{flex:1,padding:16,borderRadius:14,border:"1.5px solid",textAlign:"center",
                background:triggerType==="thought"?"#c8541a":"rgba(255,210,140,0.05)",color:triggerType==="thought"?"#fff":"#8a8078",borderColor:triggerType==="thought"?"#c8541a":"rgba(255,210,140,0.1)"}}>
                <div style={{fontSize:26,marginBottom:5}}>💭</div>
                <div style={{fontSize:13,fontWeight:700,lineHeight:1.3}}>Something I thought of</div>
              </button>
              <button onClick={()=>setTrigType("saw")} style={{flex:1,padding:16,borderRadius:14,border:"1.5px solid",textAlign:"center",
                background:triggerType==="saw"?"#c8541a":"rgba(255,210,140,0.05)",color:triggerType==="saw"?"#fff":"#8a8078",borderColor:triggerType==="saw"?"#c8541a":"rgba(255,210,140,0.1)"}}>
                <div style={{fontSize:26,marginBottom:5}}>👁</div>
                <div style={{fontSize:13,fontWeight:700,lineHeight:1.3}}>Something I saw</div>
              </button>
            </div>

            {triggerType==="saw"&&(
              <div style={{animation:"slideUp 0.25s ease"}}>
                <div style={{fontSize:11,fontWeight:800,color:"#7a7068",marginBottom:10,letterSpacing:"0.08em"}}>WHERE DID YOU SEE IT?</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
                  {PLATFORMS.map(p=><Chip key={p} label={p} sel={platform===p} onSel={()=>setPlatform(p)}/>)}
                </div>
              </div>
            )}
          </div>

          {/* Continue */}
          <button onClick={()=>setState("away")} disabled={!canContinue} style={{
            width:"100%",padding:17,borderRadius:16,background:canContinue?"#c8541a":"rgba(255,210,140,0.06)",
            color:canContinue?"#fff":"#3a3028",border:"none",fontSize:16,fontWeight:800,letterSpacing:"-0.01em",
            transition:"background 0.2s,color 0.2s"
          }}>Step away for 30 minutes →</button>
          <GBtn l="I already overcame it" o={()=>{onOvercome();setState("celebrate");}}/>
        </div>
      </div>
    );
  }

  if(state==="away"){
    const R=58,circ=2*Math.PI*R;
    const moves=[
      {icon:"🚶",text:"Go for a walk — even 10 minutes changes your brain chemistry."},
      {icon:"🏋️",text:"Hit the gym. Channel this energy somewhere real."},
      {icon:"📞",text:"Call a friend. Not about this — just connect with someone."},
      {icon:"🧠",text:"Sit with this question: what are you actually looking for from porn?"},
    ];
    return(
      <div style={{flex:1,overflowY:"auto",background:"#141210"}}>
        <div style={{display:"flex",flexDirection:"column",padding:"28px 20px 40px",gap:20}}>
          <div>
            <div style={{fontWeight:800,fontSize:26,color:"#ede4d0",marginBottom:6,letterSpacing:"-0.03em",lineHeight:1.2}}>Good. Make this time yours.</div>
            <div style={{fontSize:15,color:"#8a8078",lineHeight:1.6}}>You just bought yourself 30 minutes of forward movement. Use it.</div>
          </div>

          {/* Activity cards */}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {moves.map(m=>(
              <div key={m.icon} className="card" style={{padding:"14px 16px",display:"flex",alignItems:"flex-start",gap:14}}>
                <div style={{fontSize:28,lineHeight:1,marginTop:1,flexShrink:0}}>{m.icon}</div>
                <div style={{fontSize:14,color:"#c0b8a8",lineHeight:1.6,fontWeight:500}}>{m.text}</div>
              </div>
            ))}
          </div>

          {/* Timer — secondary, not the focus */}
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"8px 0"}}>
            <div style={{position:"relative",width:132,height:132,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <svg style={{position:"absolute",transform:"rotate(-90deg)"}} width="132" height="132">
                <circle cx="66" cy="66" r={R} fill="none" stroke="rgba(255,210,140,0.1)" strokeWidth="7"/>
                <circle cx="66" cy="66" r={R} fill="none" stroke="#c8913c" strokeWidth="7" strokeDasharray={circ} strokeDashoffset={circ*(1-left/DEMO_SECS)} strokeLinecap="round" style={{transition:"stroke-dashoffset 1s linear"}}/>
              </svg>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:28,fontWeight:800,color:"#ede4d0",fontVariantNumeric:"tabular-nums",letterSpacing:"-0.03em"}}>{fmt(left)}</div>
                <div style={{fontSize:10,color:"#7a7068",fontWeight:700,letterSpacing:"0.06em"}}>LEFT</div>
              </div>
            </div>
            <GBtn l="I'm back early →" o={()=>setState("checkin")}/>
          </div>
        </div>
      </div>
    );
  }

  if(state==="checkin") return(
    <div style={C}>
      <div style={{fontSize:52}}>👋</div>
      <div>
        <div style={{fontWeight:800,fontSize:26,color:"#ede4d0",marginBottom:8,letterSpacing:"-0.03em",lineHeight:1.15}}>Welcome back.</div>
        <div style={{fontSize:15,color:"#8a8078",maxWidth:280,lineHeight:1.65}}>How are you feeling after that break?</div>
      </div>
      <div style={{width:"100%",display:"flex",flexDirection:"column",gap:10}}>
        <button onClick={()=>{onOvercome();setState("celebrate");}} style={{width:"100%",padding:18,borderRadius:16,fontSize:16,fontWeight:800,background:"#c8913c",color:"#fff",border:"none",display:"flex",alignItems:"center",justifyContent:"center",gap:10,letterSpacing:"-0.01em",boxShadow:"0 4px 20px rgba(200,145,60,0.35)"}}>
          ✓ No longer have the urge
        </button>
        <button onClick={()=>setState("still-urge")} style={{width:"100%",padding:17,borderRadius:16,fontSize:16,fontWeight:600,background:"#1e1b17",color:"#c0b8a8",border:"1.5px solid rgba(255,210,140,0.1)",letterSpacing:"-0.005em"}}>
          The urge is still there
        </button>
      </div>
    </div>
  );

  if(state==="still-urge"){
    const now8PM =()=>{const d=new Date();d.setHours(22,0,0,0);return d.getTime()<Date.now()?d.getTime()+86400000:d.getTime();};
    const tomorrow=()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(8,0,0,0);return d.getTime();};
    const thisWeek=()=>{const d=new Date();d.setDate(d.getDate()+7);d.setHours(8,0,0,0);return d.getTime();};
    const opts=[
      {label:"In 30 minutes",   dueAt:Date.now()+DEMO_SECS*1000},
      {label:"Later today",     dueAt:now8PM()},
      {label:"Tomorrow",        dueAt:tomorrow()},
      {label:"This week",       dueAt:thisWeek()},
    ];
    return(
      <div style={{flex:1,overflowY:"auto",background:"#141210"}}>
        <div style={{padding:"28px 22px 40px",display:"flex",flexDirection:"column",gap:24}}>
          <div>
            <div style={{fontWeight:800,fontSize:24,color:"#ede4d0",marginBottom:10,letterSpacing:"-0.02em",lineHeight:1.2}}>It's okay.</div>
            <div style={{fontSize:15,color:"#c0b8a8",lineHeight:1.75}}>
              The urge is still there — and you know what? <strong>You can act on it if you choose to.</strong> You're not locked out. You're not in a cage.
            </div>
            <div style={{fontSize:15,color:"#c0b8a8",lineHeight:1.75,marginTop:12}}>
              Say this to yourself: <span style={{fontStyle:"italic",color:"#8a8078"}}>"I can, if I choose to."</span>
            </div>
            <div style={{fontSize:15,color:"#c0b8a8",lineHeight:1.75,marginTop:12}}>
              Now — when do you want to revisit this? Pick a time. If the urge is still real then, that's your answer. But let it breathe first.
            </div>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <div style={{fontSize:11,fontWeight:800,color:"#7a7068",marginBottom:4,letterSpacing:"0.08em"}}>CHECK BACK IN…</div>
            {opts.map(opt=>(
              <button key={opt.label} onClick={()=>{setCommitment(opt);reset();}} style={{
                width:"100%",padding:"16px 20px",borderRadius:14,
                background:"#1e1b17",color:"#ede4d0",border:"1.5px solid rgba(255,210,140,0.1)",
                fontSize:15,fontWeight:700,textAlign:"left",
                display:"flex",alignItems:"center",justifyContent:"space-between",letterSpacing:"-0.01em"
              }}>
                <span>{opt.label}</span>
                <span style={{fontSize:18,color:"#4a4038"}}>→</span>
              </button>
            ))}
          </div>

          <GBtn l="I chose to view right now" o={()=>setState("gave-in-journal")}/>
        </div>
      </div>
    );
  }

  if(state==="commitment-checkin") return(
    <div style={C}>
      <div style={{fontSize:52,animation:"springPop 0.5s cubic-bezier(0.34,1.56,0.64,1)"}}>⏰</div>
      <div>
        <div style={{fontWeight:800,fontSize:22,color:"#ede4d0",marginBottom:8,letterSpacing:"-0.02em",lineHeight:1.2}}>{commitment?.label} is up.</div>
        <div style={{fontSize:15,color:"#8a8078",maxWidth:280,lineHeight:1.65}}>No judgment either way. Just be honest — that's how you grow.</div>
      </div>
      <div style={{width:"100%",display:"flex",flexDirection:"column",gap:10}}>
        <button onClick={()=>{setCommitment(null);onOvercome();setState("celebrate");}} style={{width:"100%",padding:18,borderRadius:16,fontSize:16,fontWeight:800,background:"#c8913c",color:"#fff",border:"none",display:"flex",alignItems:"center",justifyContent:"center",gap:10,letterSpacing:"-0.01em",boxShadow:"0 4px 20px rgba(200,145,60,0.35)"}}>
          ✓ Didn't need it anymore
        </button>
        <button onClick={()=>{setCommitment(null);setState("gave-in-journal");}} style={{width:"100%",padding:17,borderRadius:16,fontSize:16,fontWeight:600,background:"#1e1b17",color:"#c0b8a8",border:"1.5px solid rgba(255,210,140,0.1)",letterSpacing:"-0.005em"}}>
          I chose to view
        </button>
      </div>
    </div>
  );

  if(state==="celebrate") return(
    <div style={{...C,position:"relative",overflow:"hidden"}}>
      <Confetti/>
      <div style={{fontSize:60,animation:"springPop 0.6s cubic-bezier(0.34,1.56,0.64,1)"}}>🏆</div>
      <div>
        <div style={{fontWeight:800,fontSize:28,color:"#ede4d0",marginBottom:8,letterSpacing:"-0.03em"}}>You did it.</div>
        <div style={{fontSize:16,color:"#8a8078",maxWidth:280,lineHeight:1.65}}>That wasn't easy. You chose the harder, better path.</div>
      </div>
      <div className="card" style={{padding:"18px 32px",width:"100%",textAlign:"center"}}>
        <div style={{color:"#7a7068",fontSize:12,fontWeight:700,marginBottom:6,letterSpacing:"0.06em"}}>TOTAL URGES OVERCOME</div>
        <div style={{color:"#ede4d0",fontWeight:800,fontSize:48,letterSpacing:"-0.04em",animation:"countUp 0.4s cubic-bezier(0.34,1.56,0.64,1)"}}>{urges}</div>
        {nm&&<div style={{fontSize:12,color:"#7a7068",marginTop:6,fontWeight:500}}>{nm.away} away from your next badge</div>}
      </div>
      <div style={{width:"100%"}}>
        <PBtn l="📓 Reflect on what happened" o={()=>setState("journal")}/>
        <SBtn l="✉️ Message your partner" o={()=>{goToMessages();reset();}}/>
        <GBtn l="Done for now" o={reset}/>
      </div>
    </div>
  );

  const JournalFields=({saveLabel,outcome})=>(
    <div style={{flex:1,overflowY:"auto",padding:"22px 20px"}}>
      {outcome==="gave-in"?(
        <div style={{background:"#1e1b17",borderRadius:20,padding:"22px 20px",marginBottom:22,textAlign:"center"}}>
          <div style={{fontSize:17,color:"#fff",fontWeight:700,lineHeight:1.65,letterSpacing:"-0.01em"}}>
            The only way we fail is we do not reflect and learn from this experience.
          </div>
        </div>
      ):(
        <div style={{textAlign:"center",marginBottom:22}}>
          <div style={{fontSize:30,marginBottom:8}}>📓</div>
          <div style={{fontWeight:800,fontSize:20,color:"#ede4d0",marginBottom:4,letterSpacing:"-0.02em"}}>Reflect</div>
          <div style={{fontSize:14,color:"#7a7068",fontWeight:500}}>This is where the real growth happens.</div>
        </div>
      )}

      {outcome==="gave-in"&&(
        <>
          {/* What time */}
          <div className="card" style={{padding:"16px 18px",marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:800,color:"#7a7068",marginBottom:10,letterSpacing:"0.08em"}}>WHAT TIME WAS IT?</div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <input value={logTime} onChange={e=>setLogTime(e.target.value)}
                style={{flex:1,background:"#252118",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:10,padding:"10px 14px",fontSize:15,outline:"none",color:"#ede4d0",fontWeight:600}}/>
              <button onClick={()=>setLogTime(new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}))} style={{background:"#1a1714",border:"none",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#c0b8a8",fontWeight:700}}>Now</button>
            </div>
          </div>

          {/* Where */}
          <div className="card" style={{padding:"16px 18px",marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:800,color:"#7a7068",marginBottom:12,letterSpacing:"0.08em"}}>WHERE WERE YOU?</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
              {LOCATIONS.map(l=><Chip key={l} label={l} sel={location===l} onSel={()=>setLocation(l)}/>)}
            </div>
          </div>

          {/* Trigger */}
          <div className="card" style={{padding:"16px 18px",marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:800,color:"#7a7068",marginBottom:12,letterSpacing:"0.08em"}}>WHAT TRIGGERED IT?</div>
            <div style={{display:"flex",gap:10,marginBottom:triggerType==="saw"?14:0}}>
              <button onClick={()=>{setTrigType("thought");setPlatform("");}} style={{flex:1,padding:16,borderRadius:14,border:"1.5px solid",textAlign:"center",
                background:triggerType==="thought"?"#c8541a":"rgba(255,210,140,0.05)",color:triggerType==="thought"?"#fff":"#8a8078",borderColor:triggerType==="thought"?"#c8541a":"rgba(255,210,140,0.1)"}}>
                <div style={{fontSize:26,marginBottom:5}}>💭</div>
                <div style={{fontSize:13,fontWeight:700,lineHeight:1.3}}>Something I thought of</div>
              </button>
              <button onClick={()=>setTrigType("saw")} style={{flex:1,padding:16,borderRadius:14,border:"1.5px solid",textAlign:"center",
                background:triggerType==="saw"?"#c8541a":"rgba(255,210,140,0.05)",color:triggerType==="saw"?"#fff":"#8a8078",borderColor:triggerType==="saw"?"#c8541a":"rgba(255,210,140,0.1)"}}>
                <div style={{fontSize:26,marginBottom:5}}>👁</div>
                <div style={{fontSize:13,fontWeight:700,lineHeight:1.3}}>Something I saw</div>
              </button>
            </div>
            {triggerType==="saw"&&(
              <div style={{animation:"slideUp 0.25s ease"}}>
                <div style={{fontSize:11,fontWeight:800,color:"#7a7068",marginBottom:10,letterSpacing:"0.08em"}}>WHERE DID YOU SEE IT?</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
                  {PLATFORMS.map(p=><Chip key={p} label={p} sel={platform===p} onSel={()=>setPlatform(p)}/>)}
                </div>
              </div>
            )}
          </div>
        </>
      )}

      <div style={{marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:700,color:"#c0b8a8",marginBottom:10,letterSpacing:"0.04em"}}>HOW WERE YOU FEELING?</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {EMOTIONS.map(e=>(
            <button key={e} onClick={()=>setEmo(e)} style={{padding:"7px 14px",borderRadius:22,fontSize:13,fontWeight:600,border:"1.5px solid",
              background:selEmo===e?"#c8541a":"rgba(255,210,140,0.05)",color:selEmo===e?"#fff":"#8a8078",borderColor:selEmo===e?"#c8541a":"rgba(255,210,140,0.1)"}}>{e}</button>
          ))}
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:700,color:"#c0b8a8",marginBottom:8,letterSpacing:"0.04em"}}>WHAT HAPPENED?</div>
        <textarea value={wh} onChange={e=>setWh(e.target.value)} rows={3} placeholder="Walk through the moment..."
          style={{width:"100%",background:"#1e1b17",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:12,padding:"11px 14px",fontSize:14,outline:"none",resize:"none",lineHeight:1.6,color:"#ede4d0",fontFamily:"inherit"}}/>
      </div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:12,fontWeight:700,color:"#c0b8a8",marginBottom:8,letterSpacing:"0.04em"}}>WHAT WILL YOU DO DIFFERENTLY?</div>
        <textarea value={nx} onChange={e=>setNx(e.target.value)} rows={3} placeholder="One concrete change..."
          style={{width:"100%",background:"#1e1b17",border:"1.5px solid rgba(255,210,140,0.1)",borderRadius:12,padding:"11px 14px",fontSize:14,outline:"none",resize:"none",lineHeight:1.6,color:"#ede4d0",fontFamily:"inherit"}}/>
      </div>
      <button onClick={()=>{saveLog(outcome);reset();}} style={{width:"100%",padding:16,borderRadius:14,background:"#1e1b17",color:"#fff",border:"none",fontSize:15,fontWeight:800,letterSpacing:"-0.01em"}}>{saveLabel}</button>
    </div>
  );

  if(state==="journal")         return <JournalFields saveLabel="Save reflection" outcome="overcome"/>;

function nextOccurrence(rec){
  const now=new Date();
  const d=new Date(now);
  const diff=(rec.day-d.getDay()+7)%7;
  d.setDate(d.getDate()+diff);
  d.setHours(rec.hour,rec.minute,0,0);
  if(d<=now) d.setDate(d.getDate()+7);
  return d;
}

function getUpcomingEvents(limit=10){
  const now=new Date();
  const events=[];
  // Recurring — next 3 occurrences each
  RECURRING.forEach(r=>{
    let d=nextOccurrence(r);
    for(let i=0;i<3;i++){
      events.push({...r,_date:new Date(d),_type:"recurring"});
      d=new Date(d);d.setDate(d.getDate()+7);
    }
  });
  // Special
  SPECIAL.forEach(s=>{
    const d=new Date(s.date+"T08:00:00");
    if(d>now||s.endDate) events.push({...s,_date:d,_type:"special"});
  });
  return events.sort((a,b)=>a._date-b._date).slice(0,limit);
}

function formatCountdown(target){
  const ms=target-Date.now();
  if(ms<=0) return "Now";
  const totalMins=Math.floor(ms/60000);
  const hours=Math.floor(totalMins/60);
  const mins=totalMins%60;
  const days=Math.floor(hours/24);
  if(days>=2) return `${days} days away`;
  if(days===1) return `Tomorrow · ${hours%24}h ${mins}m`;
  if(hours>0)  return `${hours}h ${mins}m away`;
  return `${mins}m away`;
}

  // Build a map of date strings → events for this month
  const monthEvents={};
  upcoming.forEach(ev=>{
    const d=ev._date;
    if(d.getFullYear()===year&&d.getMonth()===month){
      const k=d.getDate();
      if(!monthEvents[k]) monthEvents[k]=[];
      monthEvents[k].push(ev);

        if(!monthEvents[d].find(e=>e.id===r.id)){
          const dt=new Date(year,month,d,r.hour,r.minute);
          monthEvents[d].push({...r,_date:dt,_type:"recurring"});

              const day=i+1;

      .order("created_at",{ascending:true})

  };

  const handleOnboardingDone=async(why)=>{
    if(why&&why.trim()){
      setMyWhy(why.trim());
      await sb.from("profiles").update({why:why.trim()}).eq("id",initMe.id);
    }
    setShowOnboarding(false);
  };

  const handleDm=uid=>{ setTab("messages"); };

  const handleOvercome=async()=>{
    const n=urges+1;
    setUrges(n);
    // Persist urge count
    await sb.from("profiles").update({urges_count:n}).eq("id",initMe.id);
    if(MILESTONES.includes(n)){
      const msgs={1:"took their first step 🌱",5:"overcame 5 urges 🔥",10:"hit 10 urges overcome 💪",25:"reached 25 urges overcome ⭐",50:"overcame 50 urges 🏆",100:"hit 100 urges overcome 👑"};
      const badgeLabel=BADGE_DEFS.find(b=>b.id===["first","five","ten","tfive","fifty"][MILESTONES.indexOf(n)])?.label;
      // Post milestone to group chat (general channel)
      const generalId=channels.find(c=>c.slug==="general")?.id;
      await sb.from("group_messages").insert({
        user_id:initMe.id,
        text:`${me.name} just ${msgs[n]||`overcame urge #${n}`} — give them some love! 🎉`,
        is_announcement:false,
        channel_id:generalId||null,
      });
      if(badgeLabel) showToast("🏅","New badge unlocked!",`${badgeLabel} — you earned it.`);
    }
  };

  const handleBadgeEarned=async(item)=>{
    if(me.badges?.includes(item.badgeId)) return;
    const newBadges=[...(me.badges||[]),item.badgeId];
    await sb.from("profiles").update({badges:newBadges}).eq("id",initMe.id);
    const generalId=channels.find(c=>c.slug==="general")?.id;
    await sb.from("group_messages").insert({
      user_id:initMe.id,
      text:`${me.name} earned the ${item.badgeIcon} ${item.badgeLabel} badge by completing "${item.title}"!`,
      is_badge:true,
      badge_icon:item.badgeIcon,
      channel_id:generalId||null,
    });
    showToast(item.badgeIcon,"Badge unlocked!",`${item.badgeLabel} — it shows next to your name.`);
  };

  // Save urge log to Supabase
  const handleLogSaved=async(log)=>{
    const {data}=await sb.from("urge_logs").insert({
      user_id:    initMe.id,
      outcome:    log.outcome,
      emotion:    log.emotion,
      location:   log.location,
      platform:   log.platform,
      trigger_type:log.triggerType,
      what_happened:log.wh,
      next_time:  log.nx,
      log_time:   log.logTime,
    }).select().single();
    if(data) setLogs(p=>[...p,rowToLog(data)]);
  };

  // Save level check to Supabase
  const handleLevelCheckChange=async(id,checked)=>{
    if(checked){
      await sb.from("level_checks").upsert({user_id:initMe.id,check_id:id},{onConflict:"user_id,check_id"});
    } else {
      await sb.from("level_checks").delete().eq("user_id",initMe.id).eq("check_id",id);
    }
  };

  // Admin: save profile changes to Supabase
  const handleAdminSave=async(uid,data)=>{
    const dbData={};
    if(data.name!==undefined)     dbData.name=data.name;
    if(data.email!==undefined)    dbData.email=data.email;
    if(data.phone!==undefined)    dbData.phone=data.phone;
    if(data.bio!==undefined)      dbData.bio=data.bio;
    if(data.partnerId!==undefined)dbData.partner_id=data.partnerId||null;
    if(data.isAdmin!==undefined)  dbData.is_admin=data.isAdmin;
    await sb.from("profiles").update(dbData).eq("id",uid);
    setAllUsers(p=>p.map(u=>u.id===uid?{...u,...data}:u));
    if(onRefreshUsers) onRefreshUsers();
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:"#141210"}}>

      {/* Onboarding */}
      {showOnboarding&&<OnboardingFlow onDone={handleOnboardingDone}/>}

      {/* Toast */}
      <Toast toast={toast} onDismiss={()=>setToast(null)}/>

      {/* Header — frosted glass */}
      <div className="frosted-dark" style={{color:"#fff",paddingTop:"calc(14px + env(safe-area-inset-top))",paddingBottom:"14px",paddingLeft:"18px",paddingRight:"18px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,borderBottom:"0.5px solid rgba(255,255,255,0.08)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:26,filter:"drop-shadow(0 2px 8px rgba(255,180,0,0.4))"}}>☀️</span>
          <div>
            <div style={{fontWeight:800,fontSize:18,lineHeight:1.1,letterSpacing:"-0.02em"}}>Sunlight</div>
            {nm&&<div style={{color:"rgba(255,255,255,0.45)",fontSize:11,fontWeight:500,marginTop:1}}>{nm.away} to next badge</div>}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",fontWeight:700,letterSpacing:"0.06em"}}>OVERCOME</div>
            <div style={{fontWeight:800,fontSize:18,letterSpacing:"-0.02em",animation:urges>initMe.urges?"countUp 0.4s ease":""}}>{urges} 🔴</div>
          </div>
          {me.isAdmin&&(
            <button onClick={()=>setAdmin(true)} style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,0.1)",border:"0.5px solid rgba(255,255,255,0.15)",color:"#fff",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>⚙️</button>
          )}
          {onLogout&&(
            <button onClick={onLogout} title="Sign out" style={{width:32,height:32,borderRadius:"50%",background:"rgba(255,255,255,0.07)",border:"0.5px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.45)",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>↩</button>
          )}
          <button onClick={()=>setProfile(me)} style={{background:"none",border:"none",padding:0}}>
            <Avatar user={me} size={36} ring/>
          </button>
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",minHeight:0}}>
        {tab==="home"     &&<Dashboard  me={me} logs={logs} library={library} users={allUsers} urges={urges} groupMsgs={groupMsgs} onTabChange={setTab} onProfile={setProfile} callLink={callLink} startHereVideo={startHereVideo} myWhy={myWhy} setMyWhy={setMyWhy} checkIns={checkIns} onCheckIn={handleCheckIn} levelChecks={levelChecks} setLevelChecks={setLevelChecks} onCheckChange={handleLevelCheckChange} onboardingDone={!showOnboarding} hunterUnread={(dmMsgs[dmKey(me.id,HUNTER_UUID)]||[]).filter(m=>!m.isRead&&m.fromId===HUNTER_UUID).length} onGoToChannel={(slug)=>{setOpenChannelSlug(slug);setTab("messages");}} onLogSlip={()=>{setUrgeStart("gave-in-journal");setTab("urge");}}/>}
        {tab==="messages" &&<MessagesScreen me={me} users={allUsers} channels={channels} groupMsgs={groupMsgs} setGroupMsgs={setGroupMsgs} dmMsgs={dmMsgs} setDmMsgs={setDmMsgs} openChannelSlug={openChannelSlug} setOpenChannelSlug={setOpenChannelSlug}/>}
        {tab==="calendar" &&<CalendarTab/>}
        {tab==="library"  &&<Library    me={me} library={library} setLibrary={setLibrary} callLink={callLink} onBadgeEarned={handleBadgeEarned}/>}
        {tab==="urge"     &&<RedButton  me={me} goToMessages={()=>setTab("chat")} urges={urges} onOvercome={handleOvercome} onLogSaved={handleLogSaved} startState={urgeStart} onStartConsumed={()=>setUrgeStart("idle")}/>}
      </div>

      {/* Nav — frosted glass */}
      <div className="frosted-light" style={{borderTop:"0.5px solid rgba(255,210,140,0.07)",display:"flex",flexShrink:0,paddingBottom:"env(safe-area-inset-bottom)",alignItems:"flex-end"}}>
        {TABS.map(t=>{
          const isUrge=t.id==="urge";
          const active=tab===t.id;
          return(
            <button key={t.id} onClick={()=>{if(t.id==="urge")setUrgeStart("idle");setTab(t.id);}} style={{
              flex:1,padding:isUrge?"0 0 8px":"9px 0 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:isUrge?0:2,
              background:"none",border:"none",color:active?"#c8913c":"#3a3028",transition:"color 0.2s"
            }}>
              {isUrge?(
                <div style={{
                  width:54,height:54,borderRadius:"50%",
                  background:active?"#9d3d2e":"#2a1e16",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:22,marginTop:-20,
                  boxShadow:active?"0 0 28px rgba(157,61,46,0.6), 0 4px 16px rgba(0,0,0,0.4)":"0 4px 16px rgba(0,0,0,0.5)",
                  border:"3px solid #141210",
                  animation:active?"none":"none",
                  transition:"all 0.3s cubic-bezier(0.34,1.2,0.64,1)"
                }}>
                  <div style={{width:16,height:16,borderRadius:"50%",background:active?"#ff8c70":"#9d3d2e",boxShadow:active?"0 0 12px rgba(255,140,112,0.8)":"none",transition:"all 0.3s"}}/>
                </div>
              ):(
                <span style={{fontSize:21,lineHeight:1,opacity:active?1:0.35,transition:"opacity 0.2s"}}>{t.icon}</span>
              )}
              <span style={{fontSize:9,fontWeight:active?600:400,letterSpacing:"0.06em",marginTop:isUrge?5:0,textTransform:"uppercase",color:active?"#c8913c":"#3a3028",transition:"color 0.2s"}}>{t.label}</span>
              {active&&!isUrge&&<div style={{width:3,height:3,borderRadius:"50%",background:"#c8913c",marginTop:2}}/>}
            </button>
          );
        })}
      </div>

      {/* SOS pill */}
      {me.partnerId&&tab!=="messages"&&tab!=="chat"&&(
        <button onClick={()=>setSos(true)} style={{
          position:"fixed",bottom:84,right:14,zIndex:100,
          background:"#9d3d2e",color:"#ede4d0",border:"none",borderRadius:26,
          padding:"9px 15px",fontSize:13,fontWeight:700,
          boxShadow:"0 4px 20px rgba(157,61,46,0.5)",
          display:"flex",alignItems:"center",gap:6,
          letterSpacing:"0.02em"
        }}>⚡ SOS</button>
      )}

      {/* Overlays */}
      {profile   &&<ProfileModal user={profile} me={me} onClose={()=>setProfile(null)} onDm={handleDm} onPatterns={()=>setPatterns(true)}/>}
      {patterns  &&<PatternsModal logs={logs} onClose={()=>setPatterns(false)}/>}
      {sosOpen   &&<SOSModal partner={partner} onClose={()=>setSos(false)}/>}
      {adminOpen &&<AdminPanel users={allUsers} callLink={callLink} setCallLink={setCallLink} startHereVideo={startHereVideo} setStartHereVideo={setStartHereVideo} onClose={()=>setAdmin(false)} onUpdate={handleAdminSave} me={me}/>}
    </div>
  );
}

// ─── Loading screen ───────────────────────────────────────────────────────────
function LoadingScreen(){
  return(
    <div style={{height:"100%",background:"#1e1b17",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:18}}>
      <div style={{fontSize:56,filter:"drop-shadow(0 4px 20px rgba(255,180,0,0.35))",animation:"breathe 2s infinite"}}>☀️</div>
      <div style={{fontSize:15,color:"#7a7068",fontWeight:500,letterSpacing:"0.02em"}}>Loading…</div>
    </div>
  );
}

// ─── Root ─────────────────────────────────────────────────────────────────────

function App(){
  const [screen,         setScreen]         =useState("loading");
  const [me,             setMe]             =useState(null);
  const [allUsers,       setAllUsers]       =useState([]);
  const [showOnboarding, setShowOnboarding] =useState(false);

  // Load profile from Supabase by user id
  const loadProfile=async(userId)=>{
    console.log("[Sunlight] loadProfile called:", userId);
    const [{data:profile},{data:all}]=await Promise.all([
      sb.from("profiles").select("*").eq("id",userId),
      sb.from("profiles").select("*"),
    ]);
    console.log("[Sunlight] profile result:", profile);
    if(profile&&profile.length>0){
      console.log("[Sunlight] profile found, switching to app");
      setMe(rowToProfile(profile[0]));
      setAllUsers((all||[]).map(rowToProfile));
      setScreen("app");
    } else {
      console.log("[Sunlight] no profile found, retrying in 2s");
      setTimeout(async()=>{
        const {data:d2}=await sb.from("profiles").select("*").eq("id",userId);
        console.log("[Sunlight] retry result:", d2);
        if(d2&&d2.length>0){
          const {data:all2}=await sb.from("profiles").select("*");
          setMe(rowToProfile(d2[0]));
          setAllUsers((all2||[]).map(rowToProfile));
          setScreen("app");
        } else {
          setScreen("login");
        }
      },2000);
    }
  };

  // On mount: restore existing session; sign-out listener
  useEffect(()=>{
    // Check for a persisted session (returning visitor)
    sb.auth.getSession().then(({data:{session}})=>{
      console.log("[Sunlight] getSession:", session?.user?.id);
      if(session) loadProfile(session.user.id);
      else setScreen("login");
    });
    // Only watch for sign-out events; login() handles sign-in directly
    const {data:{subscription}}=sb.auth.onAuthStateChange((_event,session)=>{
      console.log("[Sunlight] auth event:", _event, session?.user?.id);
      if(!session){ setMe(null); setAllUsers([]); setScreen("login"); }
    });
    return()=>subscription.unsubscribe();
  },[]);

  // Real Supabase login — directly transitions to app
  const login=async(email,password)=>{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) return error.message;
    console.log("[Sunlight] signIn success, userId:", data?.user?.id);
    if(data?.user){
      let {data:profile}=await sb.from("profiles").select("*").eq("id",data.user.id);
      console.log("[Sunlight] login profile:", profile);
      // Auto-create profile if trigger didn't fire
      if(!profile||profile.length===0){
        console.log("[Sunlight] no profile, creating one");
        const name=data.user.user_metadata?.name||email.split("@")[0];
        await sb.from("profiles").upsert({
          id:       data.user.id,
          name,
          email,
          is_admin: email==="hunter@sunlightjourney.com",
        });
        const {data:p2}=await sb.from("profiles").select("*").eq("id",data.user.id);
        profile=p2;
      }
      const {data:all}=await sb.from("profiles").select("*");
      if(profile&&profile.length>0){
        setMe(rowToProfile(profile[0]));
        setAllUsers((all||[]).map(rowToProfile));
        setScreen("app");
      } else {
        return "Profile setup failed — please contact support.";
      }
    }
    return null;
  };

  // Real Supabase signup
  const signup=async(form)=>{
    const {data,error}=await sb.auth.signUp({
      email:form.email,
      password:form.password,
      options:{data:{name:form.name}},
    });
    if(error) return error.message;
    if(data?.user){
      // Upsert extra profile fields the trigger doesn't set
      await sb.from("profiles").upsert({
        id:        data.user.id,
        name:      form.name,
        email:     form.email,
        phone:     form.phone,
        bio:       form.bio||"",
        photo_url: form.photo||null,
        color:     form.color||"#3b82f6",
        is_admin:  form.email==="hunter@sunlightjourney.com",
      });
      setShowOnboarding(true);
      await loadProfile(data.user.id);
    }
    return null;
  };

  const logout=async()=>{
    await sb.auth.signOut();
    setMe(null);
    setAllUsers([]);
    setScreen("login");
  };

  const refreshUsers=async()=>{
    const {data}=await sb.from("profiles").select("*");
    if(data) setAllUsers(data.map(rowToProfile));
  };

  if(screen==="loading") return <LoadingScreen/>;
  if(screen==="login")   return <LoginScreen  onLogin={login}  onSignup={()=>setScreen("signup")}/>;
  if(screen==="signup")  return <SignupScreen onSignup={signup} onBack={()=>setScreen("login")}/>;
  return <MainApp me={me} allUsers={allUsers} setAllUsers={setAllUsers}
    showOnboarding={showOnboarding} setShowOnboarding={setShowOnboarding}
    onLogout={logout} onRefreshUsers={refreshUsers}/>;
}


class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return{error:e};}
  componentDidCatch(e,info){console.error("[ErrorBoundary]",e,info);}
  render(){
    if(this.state.error)return(
      <div style={{padding:20,color:"red",background:"#1e1b17",height:"100%",overflowY:"auto",fontSize:12,whiteSpace:"pre-wrap",fontFamily:"monospace"}}>
        <b>{"App Error — copy this and send to Hunter:\n\n"}</b>
        <div>{String(this.state.error)}</div>
        <div style={{marginTop:8,opacity:0.7}}>{this.state.error?.stack}</div>
      </div>
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
