// iOS-style notification that slides in from top

function Toast({toast,onDismiss}){
  useEffect(()=>{
    if(!toast) return;
    const t=setTimeout(onDismiss, 3800);
    return()=>clearTimeout(t);
  },[toast]);
  if(!toast) return null;
  return(
    <div onClick={onDismiss} style={{
      position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:999,
      width:"calc(100% - 32px)",maxWidth:358,
      background:"rgba(30,30,40,0.92)",
      backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",
      borderRadius:18,padding:"14px 16px",
      display:"flex",alignItems:"center",gap:14,
      boxShadow:"0 8px 32px rgba(0,0,0,0.32),0 0 0 0.5px rgba(255,255,255,0.08)",
      animation:"slideDown 0.4s cubic-bezier(0.34,1.56,0.64,1)",cursor:"pointer"
    }}>
      <div style={{fontSize:32,flexShrink:0,animation:"springPop 0.5s 0.2s both"}}>{toast.icon}</div>
      <div>
        <div style={{fontWeight:700,fontSize:14,color:"#fff",marginBottom:2}}>{toast.title}</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.6)",lineHeight:1.4}}>{toast.body}</div>
      </div>
    </div>
  );
}

      <div key={slide} style={{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",gap:28,animation:"slideInRight 0.32s cubic-bezier(0.34,1.2,0.64,1)",width:"100%"}}>
        <div style={{fontSize:80,lineHeight:1,filter:"drop-shadow(0 4px 24px rgba(255,255,255,0.15))"}}>{s.emoji}</div>
        <div style={{width:"100%"}}>
          <div style={{fontWeight:800,fontSize:30,color:"#fff",letterSpacing:"-0.03em",marginBottom:16,lineHeight:1.15,whiteSpace:"pre-line"}}>{s.title}</div>
          <div style={{fontSize:17,color:"rgba(255,255,255,0.58)",lineHeight:1.65,maxWidth:290,margin:"0 auto"}}>{s.body}</div>
          {s.isWhy&&(
            <div style={{marginTop:22,width:"100%",maxWidth:320,margin:"22px auto 0"}}>
              <div style={{fontSize:13,color:"rgba(255,255,255,0.4)",fontWeight:700,marginBottom:10,letterSpacing:"0.04em",textAlign:"left"}}>I'M DOING THIS BECAUSEâ€¦</div>
              <textarea value={why} onChange={e=>setWhy(e.target.value)} rows={3}
                placeholder="Be honest. This is for you."
                style={{width:"100%",background:"rgba(255,255,255,0.08)",border:"1.5px solid rgba(255,255,255,0.15)",borderRadius:14,padding:"13px 16px",fontSize:15,color:"#fff",outline:"none",resize:"none",lineHeight:1.6,fontFamily:"inherit"}}
                autoFocus/>
            </div>
          )}
        </div>
      </div>

      <div style={{display:"flex",gap:6,marginTop:40,marginBottom:28}}>
        {ONBOARDING.map((_,i)=>(
          <div key={i} onClick={()=>setSlide(i)} style={{height:4,borderRadius:999,background:i===slide?"#fff":"rgba(255,255,255,0.2)",width:i===slide?28:8,cursor:"pointer",transition:"all 0.3s cubic-bezier(0.34,1.56,0.64,1)"}}/>
        ))}
      </div>

      <button onClick={()=>isLast?onDone(why):setSlide(s=>s+1)} disabled={!canAdvance} style={{
        width:"100%",maxWidth:320,padding:18,borderRadius:18,
        background:isLast?(canAdvance?"#c8913c":"rgba(255,255,255,0.12)"):"rgba(255,255,255,0.1)",
        color:"rgba(255,255,255,0.85)",
        border:(isLast&&canAdvance)?"none":"1px solid rgba(255,255,255,0.15)",
        fontSize:17,fontWeight:700,letterSpacing:"-0.01em",
        transition:"all 0.2s"
      }}>{isLast?"Let's go â†’":"Continue"}</button>
    </div>
  );
}

  const maxP=topPlats[0]?.[1]||1;

  // Platform recommendations: any platform 3+ times in last 10 logs
  const recent=logs.slice(-10);
  const recPlat={};
  recent.forEach(l=>{if(l.platform) recPlat[l.platform]=(recPlat[l.platform]||0)+1;});

            <button onClick={()=>setAdmin(true)} style={{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,0.1)",border:"0.5px solid rgba(255,255,255,0.15)",color:"#fff",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>âš™ï¸</button>
          )}
          {onLogout&&(
            <button onClick={onLogout} title="Sign out" style={{width:32,height:32,borderRadius:"50%",background:"rgba(255,255,255,0.07)",border:"0.5px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.45)",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>â†©</button>
          )}
          <button onClick={()=>setProfile(me)} style={{background:"none",border:"none",padding:0}}>
            <Avatar user={me} size={36} ring/>
          </button>
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",minHeight:0}}>
        {tab==="home"     &&<Dashboard  me={me} logs={logs} library={library} users={allUsers} urges={urges} groupMsgs={groupMsgs} onTabChange={setTab} onProfile={setProfile} callLink={callLink} myWhy={myWhy} setMyWhy={setMyWhy} checkIns={checkIns} onCheckIn={handleCheckIn} levelChecks={levelChecks} setLevelChecks={setLevelChecks} onCheckChange={handleLevelCheckChange} onboardingDone={!showOnboarding} hunterUnread={(dmMsgs[dmKey(me.id,HUNTER_UUID)]||[]).filter(m=>!m.isRead&&m.fromId===HUNTER_UUID).length}/>}
        {tab==="messages" &&<MessagesScreen me={me} users={allUsers} channels={channels} groupMsgs={groupMsgs} setGroupMsgs={setGroupMsgs} dmMsgs={dmMsgs} setDmMsgs={setDmMsgs}/>}
        {tab==="calendar" &&<CalendarTab/>}
        {tab==="library"  &&<Library    me={me} library={library} setLibrary={setLibrary} callLink={callLink} onBadgeEarned={handleBadgeEarned}/>}
        {tab==="urge"     &&<RedButton  me={me} goToMessages={()=>setTab("chat")} urges={urges} onOvercome={handleOvercome} onLogSaved={handleLogSaved}/>}
      </div>

      {/* Nav â€” frosted glass */}
      <div className="frosted-light" style={{borderTop:"0.5px solid rgba(255,210,140,0.07)",display:"flex",flexShrink:0,paddingBottom:"env(safe-area-inset-bottom)",alignItems:"flex-end"}}>
        {TABS.map(t=>{
          const isUrge=t.id==="urge";
          const active=tab===t.id;
          return(
            <button key={t.id} onClick={()=>{setTab(t.id);}} style={{
              flex:1,padding:isUrge?"0 0 8px":"9px 0 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:isUrge?0:2,
              background:"none",border:"none",color:active?"#c8913c":"#3a3028",transition:"color 0.2s"
            }}>
              {isUrge?(
                <div style={{
                  width:54,height:54,borderRadius:"50%",
                  background:active?"#9d3d2e":"#2a1e16",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:22,marginTop:-20,
                  boxShadow:active?"0 0 28px rgba(157,61,46,0.6), 0 4px 16px rgba(0,0,0,0.4)":"0 4px 16px rgba(0,0,0,0.5)",
                  border:"3px solid #141210",
                  animation:active?"none":"none",
                  transition:"all 0.3s cubic-bezier(0.34,1.2,0.64,1)"
                }}>
                  <div style={{width:16,height:16,borderRadius:"50%",background:active?"#ff8c70":"#9d3d2e",boxShadow:active?"0 0 12px rgba(255,140,112,0.8)":"none",transition:"all 0.3s"}}/>
                </div>
              ):(
                <span style={{fontSize:21,lineHeight:1,opacity:active?1:0.35,transition:"opacity 0.2s"}}>{t.icon}</span>
              )}
              <span style={{fontSize:9,fontWeight:active?600:400,letterSpacing:"0.06em",marginTop:isUrge?5:0,textTransform:"uppercase",color:active?"#c8913c":"#3a3028",transition:"color 0.2s"}}>{t.label}</span>
              {active&&!isUrge&&<div style={{width:3,height:3,borderRadius:"50%",background:"#c8913c",marginTop:2}}/>}
            </button>
          );
        })}
      </div>

      {/* SOS pill */}
      {me.partnerId&&tab!=="messages"&&tab!=="chat"&&(
        <button onClick={()=>setSos(true)} style={{
          position:"fixed",bottom:84,right:14,zIndex:100,
          background:"#9d3d2e",color:"#ede4d0",border:"none",borderRadius:26,
          padding:"9px 15px",fontSize:13,fontWeight:700,
          boxShadow:"0 4px 20px rgba(157,61,46,0.5)",
          display:"flex",alignItems:"center",gap:6,
          letterSpacing:"0.02em"
        }}>âš¡ SOS</button>
      )}

      {/* Overlays */}
      {profile   &&<ProfileModal user={profile} me={me} onClose={()=>setProfile(null)} onDm={handleDm} onPatterns={()=>setPatterns(true)}/>}
      {patterns  &&<PatternsModal logs={logs} onClose={()=>setPatterns(false)}/>}
      {sosOpen   &&<SOSModal partner={partner} onClose={()=>setSos(false)}/>}
      {adminOpen &&<AdminPanel users={allUsers} callLink={callLink} setCallLink={setCallLink} onClose={()=>setAdmin(false)} onUpdate={handleAdminSave} me={me}/>}
    </div>
  );
}

// â”€â”€â”€ Loading screen â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function LoadingScreen(){
  return(
    <div style={{height:"100%",background:"#1e1b17",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:18}}>
      <div style={{fontSize:56,filter:"drop-shadow(0 4px 20px rgba(255,180,0,0.35))",animation:"breathe 2s infinite"}}>â˜€ï¸</div>
      <div style={{fontSize:15,color:"#7a7068",fontWeight:500,letterSpacing:"0.02em"}}>Loadingâ€¦</div>
    </div>
  );
}

// â”€â”€â”€ Root â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

function App(){
  const [screen,         setScreen]         =useState("loading");
  const [me,             setMe]             =useState(null);
  const [allUsers,       setAllUsers]       =useState([]);
  const [showOnboarding, setShowOnboarding] =useState(false);

  // Load profile from Supabase by user id
  const loadProfile=async(userId)=>{
    console.log("[Sunlight] loadProfile called:", userId);
    const [{data:profile},{data:all}]=await Promise.all([
      sb.from("profiles").select("*").eq("id",userId),
      sb.from("profiles").select("*"),
    ]);
    console.log("[Sunlight] profile result:", profile);
    if(profile&&profile.length>0){
      console.log("[Sunlight] profile found, switching to app");
      setMe(rowToProfile(profile[0]));
      setAllUsers((all||[]).map(rowToProfile));
      setScreen("app");
    } else {
      console.log("[Sunlight] no profile found, retrying in 2s");
      setTimeout(async()=>{
        const {data:d2}=await sb.from("profiles").select("*").eq("id",userId);
        console.log("[Sunlight] retry result:", d2);
        if(d2&&d2.length>0){
          const {data:all2}=await sb.from("profiles").select("*");
          setMe(rowToProfile(d2[0]));
          setAllUsers((all2||[]).map(rowToProfile));
          setScreen("app");
        } else {
          setScreen("login");
        }
      },2000);
    }
  };

  // On mount: restore existing session; sign-out listener
  useEffect(()=>{
    // Check for a persisted session (returning visitor)
    sb.auth.getSession().then(({data:{session}})=>{
      console.log("[Sunlight] getSession:", session?.user?.id);
      if(session) loadProfile(session.user.id);
      else setScreen("login");
    });
    // Only watch for sign-out events; login() handles sign-in directly
    const {data:{subscription}}=sb.auth.onAuthStateChange((_event,session)=>{
      console.log("[Sunlight] auth event:", _event, session?.user?.id);
      if(!session){ setMe(null); setAllUsers([]); setScreen("login"); }
    });
    return()=>subscription.unsubscribe();
  },[]);

  // Real Supabase login â€” directly transitions to app
  const login=async(email,password)=>{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) return error.message;
    console.log("[Sunlight] signIn success, userId:", data?.user?.id);
    if(data?.user){
      let {data:profile}=await sb.from("profiles").select("*").eq("id",data.user.id);
      console.log("[Sunlight] login profile:", profile);
      // Auto-create profile if trigger didn't fire
      if(!profile||profile.length===0){
        console.log("[Sunlight] no profile, creating one");
        const name=data.user.user_metadata?.name||email.split("@")[0];
        await sb.from("profiles").upsert({
          id:       data.user.id,
          name,
          email,
          is_admin: email==="hunter@sunlightjourney.com",
        });
        const {data:p2}=await sb.from("profiles").select("*").eq("id",data.user.id);
        profile=p2;
      }
      const {data:all}=await sb.from("profiles").select("*");
      if(profile&&profile.length>0){
        setMe(rowToProfile(profile[0]));
        setAllUsers((all||[]).map(rowToProfile));
        setScreen("app");
      } else {
        return "Profile setup failed â€” please contact support.";
      }
    }
    return null;
  };

  // Real Supabase signup
  const signup=async(form)=>{
    const {data,error}=await sb.auth.signUp({
      email:form.email,
      password:form.password,
      options:{data:{name:form.name}},
    });
    if(error) return error.message;
    if(data?.user){
      // Upsert extra profile fields the trigger doesn't set
      await sb.from("profiles").upsert({
        id:        data.user.id,
        name:      form.name,
        email:     form.email,
        phone:     form.phone,
        bio:       form.bio||"",
        photo_url: form.photo||null,
        color:     form.color||"#3b82f6",
        is_admin:  form.email==="hunter@sunlightjourney.com",
      });
      setShowOnboarding(true);
      await loadProfile(data.user.id);
    }
    return null;
  };

  const logout=async()=>{
    await sb.auth.signOut();
    setMe(null);
    setAllUsers([]);
    setScreen("login");
  };

  const refreshUsers=async()=>{
    const {data}=await sb.from("profiles").select("*");
    if(data) setAllUsers(data.map(rowToProfile));
  };

  if(screen==="loading") return <LoadingScreen/>;
  if(screen==="login")   return <LoginScreen  onLogin={login}  onSignup={()=>setScreen("signup")}/>;
  if(screen==="signup")  return <SignupScreen onSignup={signup} onBack={()=>setScreen("login")}/>;
  return <MainApp me={me} allUsers={allUsers} setAllUsers={setAllUsers}
    showOnboarding={showOnboarding} setShowOnboarding={setShowOnboarding}
    onLogout={logout} onRefreshUsers={refreshUsers}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
